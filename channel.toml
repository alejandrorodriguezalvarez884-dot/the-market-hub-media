# The channel: what every video shares.

name = "The Market Hub"
language = "en"                      # the language of the narration and of every text on screen
site = "https://themarkethub.app"

# The video: horizontal, four to six minutes.
[video]
width = 1920
height = 1080
fps = 30
minutes = [4, 6]                     # how long a video runs
words_per_minute = 190               # the pace assumed for a scene whose narration is not made yet
gap_seconds = 0.4                    # silence left after each scene

# The Short: a few scenes of the video, drawn again upright.
[short]
width = 1080
height = 1920
seconds = [30, 60]                   # how long a Short runs

# The narration: Google Cloud Text-to-Speech, with the owner's gcloud session.
[voice]
name = "en-US-Chirp3-HD-Schedar"
language = "en-US"
rate = 1.0                           # its pace: 1.0 is the voice's own, about 200 words a minute

[youtube]
category = "27"                      # Education
privacy = "public"                   # what `make upload` asks for when PRIVACY is not said: private, unlisted or public
made_for_kids = false
synthetic_media = false              # YouTube's "altered or synthetic content" declaration
disclaimer = """
This video is for information and education only. It is not investment advice, and nothing in it \
is a recommendation to buy, sell or hold anything."""

# Instagram: the Short goes up as a reel (`make instagram`). Instagram fetches the film from an
# address anybody can reach, so it is parked in this bucket while it is published, and taken away after.
[instagram]
handle = "the_market_hub_app"
bucket = "arctic-robot-474306-g3-market-hub-reels"   # a Google Cloud Storage bucket anybody can read from (the owner agreed, 2026-10-13)

# X: each post is a file in x/ (skill post-x), put on X by hand in the browser and recorded with
# `make xposted`. The account was made by the owner on 2026-10-14.
[x]
handle = "the_market_hub_"

# A video that presents the channel or a series, instead of explaining something (kind: trailer).
[trailer]
seconds = [30, 90]

# The series: each is a subject, a playlist on YouTube and a colour on every slide of its videos.
# A script names its series with "series: <the name in brackets>".
[series.money-101]
name = "Money 101"
tagline = "How money really works. One idea at a time."
accent = "#c6f24e"
playlist = "https://www.youtube.com/playlist?list=PLUm8zJ2905YQ"   # the playlist's address on YouTube (…/playlist?list=PL…): `make upload` adds the video to it

# What every video opens and closes with (not a Short, not a trailer). Each is drawn once, in
# channel/intro.html and channel/outro.html, and said once, into channel/voice/.
[intro]
narration = "This is The Market Hub. Money, markets and companies, explained."
after = 0                            # how many of the video's own scenes play before it: 0 opens the video

[outro]
narration = "Thanks for watching. The next video is right here. And subscribe, so you don't miss the one after it."
seconds = 12                         # held at least this long: YouTube's end screen takes 5 to 20 seconds

# The daily reels on Instagram: Wall Street's open and close, told in Spanish (the owner, 2026-11-02).
# Each is a folder in reels/ (skill daily-reel), upright only, with no presenter: a format of its own.
[reel]
language = "es"
seconds = [40, 120]                  # how long a daily reel runs (the reference reels run 1:37 to 1:43)
asked_seconds = [40, 180]            # how long a reel the owner asks for may run (a reflection takes longer)
words_per_minute = 175               # the pace assumed for a scene whose narration is not made yet
gap_seconds = 0.2                    # silence left after each scene: a reel keeps moving
# The narration: ElevenLabs (the owner, 2026-11-02, after the Google voice sounded flat), with the
# voice "Dani - Energetic Spanish YouTuber", picked by ear from eight samples. Its key is the
# owner's, in .secrets/elevenlabs-key.txt (from Secret Manager, ELEVENLABS_API_KEY of llamazo-prod).
engine = "elevenlabs"
voice = "xH6DmlUWSqhSmFog5gxa"        # Dani
voice_language = "es-ES"
model = "eleven_multilingual_v2"
disclaimer = "Contenido informativo de The Market Hub. No es una recomendación de inversión."

# The reels the owner asks for one by one, to think something through (voice: reflexion in the
# script): Julián as "a wise, reflective teacher, with more character" (the owner, 2026-11-02, who
# picked this by ear: ElevenLabs v3 told the tone, after multilingual_v2 sounded odd at times).
[reel.voices.reflexion]
voice = "5Wn4TM7bYDwN5uDN0DpC"        # Julián
model = "eleven_v3"
cue = "[reflexivo, tono de profesor sereno]"   # said to v3 before each scene: how to say it, not words to say
longest_pause = 0.45                 # v3 left pauses of up to a second: cut down, for more pace (the owner, 2026-11-02)

[reel.voices.reflexion.settings]
stability = 0.5                      # v3's "natural"
speed = 1.08                         # "un pelín más de ritmo" (the owner, 2026-11-02)

# The didactic reels the owner asks for one by one, explaining a stock-market concept (voice:
# didactico in the script): Rafa, with the settings of the sample the owner heard (2026-11-02).
[reel.voices.didactico]
voice = "iJQjCIhyynnZMKT6NN3H"        # Rafa
model = "eleven_multilingual_v2"

[reel.voices.didactico.settings]
stability = 0.4
similarity_boost = 0.8
style = 0.35
use_speaker_boost = true

# The chart-reading reels the owner asks for one by one, "Lee el gráfico" (voice: grafico in the
# script; skill chart-reel): Rafalupi, "Fast, Engaging and Smart", peninsular Spanish. The owner
# wanted a voice "que enganche mucho y que sea didáctica", new to the account, and picked it by ear
# from five samples of the same hook (2026-11-03).
[reel.voices.grafico]
voice = "7xK0jqLEWCrIBJ8ymBJi"        # Rafalupi
model = "eleven_multilingual_v2"

[reel.voices.grafico.settings]       # as in the sample the owner picked
stability = 0.4
similarity_boost = 0.8
style = 0.35
use_speaker_boost = true

[reel.settings]                      # as in the sample the owner picked
stability = 0.4
similarity_boost = 0.8
style = 0.35
use_speaker_boost = true
