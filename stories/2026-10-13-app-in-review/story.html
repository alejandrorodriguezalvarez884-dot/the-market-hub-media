<!doctype html>
<meta charset="utf-8">
<!-- An Instagram story, 1080 by 1920: the app has been sent to the App Store and waits for its
     review (2026-10-13). Drawn as the app is (its page, its ink, its mark), not as a slide of the
     channel. The card is the mail App Store Connect sent the owner, written again here with his
     leave; nothing else in it is anyone else's. The top and the bottom 250 px are left empty:
     Instagram lays the account's name and the reply box over them.

       make story STORY=stories/2026-10-13-app-in-review/story.html DRAW=1   # story.jpg, to look at
       make story STORY=stories/2026-10-13-app-in-review/story.html          # and published -->
<style>
  :root { --page: #0b0c0d; --line: #222528; --ink: #c9c7c1; --ink-strong: #f2f0ea; --muted: #8c8b86; --up: #35c98f;
          --sans: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
          --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--page); color: var(--ink-strong); font-family: var(--sans); }
  body { display: flex; flex-direction: column; align-items: center; padding: 290px 90px 300px; text-align: center; }
  /* A light behind the card, so the page is not flat. */
  body::before { content: ""; position: absolute; left: 50%; top: 1030px; width: 1300px; height: 900px; transform: translate(-50%, -50%);
                 background: radial-gradient(closest-side, rgba(53, 201, 143, 0.13), transparent); z-index: -1; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 600; color: var(--ink); }
  .brand svg { width: 46px; height: 46px; }
  .status { margin-top: 150px; display: flex; align-items: center; gap: 28px; font-family: var(--mono); font-size: 29px; font-weight: 600;
            letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .status i { width: 18px; height: 18px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 9px rgba(53, 201, 143, 0.18); }
  h1 { margin-top: 44px; font-size: 136px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.0; }
  /* The mail, as it came: black on white, in the type a mail is read in. */
  .mail { margin-top: 110px; width: 860px; padding: 48px 54px 54px; border-radius: 30px; background: #fff; color: #1d1d1f; text-align: left;
          font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; transform: rotate(-3deg); box-shadow: 0 50px 120px rgba(0, 0, 0, 0.7); }
  .mail .from { padding-bottom: 26px; border-bottom: 2px solid #d9d9d9; font-size: 33px; font-weight: 700; }
  .mail h2 { margin-top: 44px; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; color: #515154; }
  .mail .app { margin-top: 40px; display: flex; align-items: center; gap: 28px; }
  .mail .icon { width: 112px; height: 112px; border-radius: 24px; background: var(--page); display: grid; place-items: center; color: var(--ink-strong); }
  .mail .icon svg { width: 62px; height: 62px; }
  .mail .name { font-size: 34px; font-weight: 700; color: #515154; }
  .mail .os { margin-top: 8px; font-size: 27px; color: #6e6e73; }
  .soon { margin-top: 120px; font-size: 62px; font-weight: 600; letter-spacing: -0.02em; }
  .site { margin-top: 22px; font-size: 34px; color: var(--muted); }
</style>
<body>
  <div class="brand">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 2v16M4 10h8"/><circle cx="14.5" cy="10" r="2.75" fill="currentColor" stroke="none"/></svg>
    <span>Market Hub</span>
  </div>
  <p class="status"><i></i>Waiting for review</p>
  <h1>It&rsquo;s in Apple&rsquo;s hands now.</h1>
  <div class="mail">
    <p class="from">App Store Connect</p>
    <h2>We&rsquo;ve received your app for review.</h2>
    <div class="app">
      <div class="icon"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 2v16M4 10h8"/><circle cx="14.5" cy="10" r="2.75" fill="currentColor" stroke="none"/></svg></div>
      <div><p class="name">The Market Hub</p><p class="os">iOS</p></div>
    </div>
  </div>
  <p class="soon">Coming soon to iPhone.</p>
  <p class="site">themarkethub.app</p>
</body>
