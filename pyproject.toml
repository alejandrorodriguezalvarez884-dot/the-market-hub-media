[project]
name = "marketmedia"
version = "0.1.0"
description = "The Market Hub's YouTube channel: each video is written, drawn, assembled and published from here."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "imageio-ffmpeg>=0.5.1",
    "playwright>=1.48.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
