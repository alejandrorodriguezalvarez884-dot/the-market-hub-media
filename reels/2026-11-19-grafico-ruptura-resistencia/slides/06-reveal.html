<!doctype html>
<!-- The reveal: the candles that came after -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker green in">La respuesta</p>
<h1 class="in">Lo que <span class="hl" data-say="siguiente">pasó</span></h1>
<p class="secret">Valor <i></i> Fechas <i></i></p>
<div class="choices"><span class="sticker green pop" data-say="once">+11,4 % en un día · ×6 volumen</span></div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }, { to: EPISODE.out, say: "siguiente", for: 0.6 }, { to: EPISODE.end, say: "siguio", for: 2.6 }],
  marks: [
    { type: "level", price: EPISODE.line, at: 0, for: 0.01 },
    { type: "ring", day: EPISODE.out, where: "close", r: 32, color: "up", say: "once" },
    { type: "move", from: [EPISODE.ask, 139.89], to: [EPISODE.end, 178.29], color: "up", label: "+27,5 %", dx: -120, say: "mes", for: 1 },
  ],
}));
</script>
</body>
</html>
