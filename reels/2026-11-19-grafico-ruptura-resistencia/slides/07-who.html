<!doctype html>
<!-- The name and the dates, and the prices on the chart -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El valor</p>
<div class="reveal pop" data-say="oracle">
  <span class="logo"><img src="../../../theme/logos/oracle.svg" alt="Oracle"></span>
  <div><b>Oracle</b><small>Junio a octubre de 2024</small></div>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source in" data-say="oracle">Oracle (ORCL) · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.end }],
  axis: { say: "oracle" },
  marks: [{ type: "level", price: EPISODE.line, at: 0, for: 0.01, label: "146,59 $" }],
}));
</script>
</body>
</html>
