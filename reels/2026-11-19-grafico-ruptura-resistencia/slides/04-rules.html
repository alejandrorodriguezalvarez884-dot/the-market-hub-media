<!doctype html>
<!-- The rules: how many touches, and no close above it -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">Lo que se mira</p>
<div class="checks">
  <p class="in" data-say="toca">La toca varias veces</p>
  <p class="in" data-say="cierre">No cierra por encima</p>
</div>
<div class="plot short"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }],
  marks: [
    { type: "level", price: EPISODE.line, at: 0, for: 0.01, label: "Resistencia" },
    { type: "ring", day: EPISODE.t1, where: "high", r: 26, color: "ink", side: "above", label: "1", say: "tres" },
    { type: "ring", day: EPISODE.t2, where: "high", r: 26, color: "ink", side: "above", label: "2", say: "tres+0.3" },
    { type: "ring", day: EPISODE.t3, where: "high", r: 26, color: "ink", side: "above", label: "3", say: "tres+0.6" },
    { type: "zone", from: EPISODE.from, to: EPISODE.ask, color: "sky", label: "60 sesiones debajo", say: "sesenta" },
  ],
}));
</script>
</body>
</html>
