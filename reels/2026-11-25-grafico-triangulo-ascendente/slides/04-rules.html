<!doctype html>
<!-- The rules: equal highs and rising lows, each shown as it is said -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">Lo que se mira</p>
<div class="checks">
  <p class="in" data-say="maximos">Máximos a la misma altura</p>
  <p class="in" data-say="tres">3 toques, ningún cierre encima</p>
  <p class="in" data-say="suelos">Suelos cada vez más altos</p>
</div>
<div class="plot short"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }],
  marks: [
    { type: "ring", day: EPISODE.hi1, where: "high", r: 24, color: "amber", say: "maximos" },
    { type: "ring", day: EPISODE.hi2, where: "high", r: 24, color: "amber", say: "tres" },
    { type: "ring", day: EPISODE.hi3, where: "high", r: 24, color: "amber", say: "tres+0.3" },
    { type: "ring", day: EPISODE.low1, where: "low", r: 24, color: "up", say: "suelos" },
    { type: "ring", day: EPISODE.low2, where: "low", r: 24, color: "up", side: "below", label: "+0,8 %", say: "cada" },
    { type: "ring", day: EPISODE.low3, where: "low", r: 24, color: "up", side: "below", label: "+3,3 %", say: "anterior" },
  ],
}));
</script>
</body>
</html>
