<!doctype html>
<!-- The name: an ascending triangle, its two lines drawn on the chart -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El patrón</p>
<h1 class="small in">Un triángulo <span class="hl" data-say="triangulo">ascendente</span></h1>
<p class="secret">Valor <i></i> Fechas <i></i></p>
<div class="choices"><span class="sticker green pop" data-say="sitio">Cada vez menos sitio</span></div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }],
  marks: [
    { type: "level", price: EPISODE.line, from: EPISODE.hi1, to: EPISODE.ask, say: "techo", for: 0.8, label: "Techo plano" },
    { type: "path", points: [[EPISODE.low1, 193.46], [EPISODE.low2, 195.07], [EPISODE.low3, 201.50]], say: "suelos", for: 1.2, color: "up" },
  ],
}));
</script>
</body>
</html>
