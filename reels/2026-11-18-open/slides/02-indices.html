<!doctype html>
<!-- The three indices -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body data-bg="grid">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Apertura</header>
<main class="reel">
<p class="kicker in">A las 15:48 en España</p>
<h1 class="small in">Abre en <span class="r">rojo</span></h1>
<div class="card in" data-say="quinientos">
  <div class="line" data-say="quinientos"><span class="name">S&amp;P 500</span><span class="fig r" data-count="0.35" data-prefix="▼ " data-decimals="2" data-suffix=" %" data-say="quinientos"></span><span class="bar"><i class="r" style="--w: 38%"></i></span></div>
  <div class="line" data-say="nasdaq"><span class="name">Nasdaq 100</span><span class="fig r">▼ 0,25 %</span><span class="bar"><i class="r" style="--w: 27%"></i></span></div>
  <div class="line" data-say="dow"><span class="name">Dow Jones</span><span class="fig r">▼ 0,91 %</span><span class="bar"><i class="r" style="--w: 100%"></i></span></div>
  <p class="note">Frente al cierre del martes · Yahoo Finance</p>
</div>
<span class="sticker amber small pop" data-say="julio">Martes: su cierre más bajo desde julio</span>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
