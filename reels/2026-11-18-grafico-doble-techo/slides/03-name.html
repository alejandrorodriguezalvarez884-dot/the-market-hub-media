<!doctype html>
<!-- The pattern's name: two peaks and a trough, traced as an M -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El patrón</p>
<h1 class="small in">Parece un <span class="hl" data-say="techo">doble techo</span></h1>
<p class="secret">Valor <i></i> Fechas <i></i></p>
<div class="choices"><span class="sticker pop" data-say="giro">Patrón de giro</span></div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }],
  marks: [
    { type: "ring", day: EPISODE.top1, where: "high", r: 30, color: "amber", label: "Techo 1", side: "above", say: "maximos" },
    { type: "ring", day: EPISODE.top2, where: "high", r: 30, color: "amber", label: "Techo 2", side: "above", say: "iguales" },
    { type: "ring", day: EPISODE.trough, where: "low", r: 30, color: "sky", label: "Valle", side: "below", say: "valle" },
    mPath({ say: "eme", for: 1 }),
  ],
}));
</script>
</body>
</html>
