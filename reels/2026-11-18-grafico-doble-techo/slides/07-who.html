<!doctype html>
<!-- Who it was, and when: the name and the axis come in -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El valor</p>
<div class="reveal pop" data-say="micron">
  <span class="logo"><img src="../../../theme/logos/micron.svg" alt="Micron"></span>
  <div><b>Micron</b><small>Abril a octubre de 2025</small></div>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source in" data-say="micron">Micron Technology (MU) · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.to }],
  axis: { say: "micron" },
  marks: [
    mPath({ at: 0, for: 0.01 }),
    { type: "level", price: EPISODE.support, color: "sky", from: EPISODE.trough, at: 0, for: 0.01, label: "103,38 $" },
    { type: "level", price: EPISODE.top1Price, dash: true, color: "ink", from: EPISODE.top1, at: 0, for: 0.01, label: "129,85 $" },
  ],
}));
</script>
</body>
</html>
