<!doctype html>
<!-- What happened: it never broke the support; it closed above both tops on 5 September and rose about 50 % more -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker green in">La respuesta</p>
<h1 class="in">Lo que <span class="hl" data-say="romperlo">pasó</span></h1>
<p class="secret">Valor <i></i> Fechas <i></i></p>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }, { to: EPISODE.over, say: "septiembre", for: 1.4 }, { to: EPISODE.peak, say: "siguio", for: 2.2 }],
  marks: [
    mPath({ at: 0, for: 0.01 }),
    { type: "level", price: EPISODE.support, color: "sky", from: EPISODE.trough, at: 0, for: 0.01, label: "Soporte" },
    { type: "level", price: EPISODE.top1Price, dash: true, color: "ink", from: EPISODE.top1, label: "Techos", say: "techos", for: 0.6 },
    { type: "move", from: [EPISODE.over, EPISODE.overClose], to: [EPISODE.peak, EPISODE.peakClose], color: "up", label: "+50 %", dx: -60, say: "cincuenta", for: 1 },
  ],
}));
</script>
</body>
</html>
