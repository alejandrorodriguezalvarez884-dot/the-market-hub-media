<!doctype html>
<!-- October CPI against forecasts -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body data-bg="candles">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Apertura</header>
<main class="reel">
<p class="kicker in">IPC de octubre · EE. UU.</p>
<h1 class="small in" data-say="precios">Los precios, <span class="y">+0,4 %</span></h1>
<div class="card amber in" data-say="mes">
  <p class="label">Subida en un mes</p>
  <div class="line" data-say="mes"><span class="name">General<small>Previsión: 0,3 %</small></span><span class="fig r">▲ 0,4 %</span></div>
  <div class="line" data-say="energia"><span class="name">Sin energía ni alimentos<small>Previsión: 0,2 %</small></span><span class="fig r">▲ 0,3 %</span></div>
  <p class="note">Oficina de Estadísticas Laborales de EE. UU., 14:30 en España · Previsiones: Yahoo Finance</p>
</div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
