<!doctype html>
<!-- Chips and Apple at the close (Yahoo Finance) -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body data-bg="candles">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Cierre</header>
<main class="reel">
<p class="kicker green in">El motor del Nasdaq</p>
<h1 class="in">Otra vez, <span class="g">los chips</span></h1>
<div class="card up in" data-say="amd">
  <p class="label">Al cierre</p>
  <div class="line" data-say="amd"><span class="name"><span class="logo"><img src="../../../theme/logos/amd.svg" alt="AMD"></span> AMD</span><span class="fig g">+3,7 %</span></div>
  <div class="line" data-say="micron"><span class="name"><span class="logo"><img src="../../../theme/logos/micron.svg" alt="Micron"></span> Micron</span><span class="fig g">+2,6 %</span></div>
  <div class="line" data-say="nvidia"><span class="name"><span class="logo"><img src="../../../theme/logos/nvidia.svg" alt="Nvidia"></span> Nvidia</span><span class="fig g">+2,3 %</span></div>
</div>
<div class="card down in" data-say="apple">
  <div class="line"><span class="name"><span class="logo"><img src="../../../theme/logos/apple.svg" alt="Apple"></span> Apple<small>Tras sus resultados del lunes</small></span><span class="fig r">−1,9 %</span></div>
</div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
