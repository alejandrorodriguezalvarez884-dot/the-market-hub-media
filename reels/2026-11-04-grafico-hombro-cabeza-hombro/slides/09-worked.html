<!doctype html>
<!-- Other times it did come true: two real head and shoulders tops that broke the line and fell -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker green in">Otras veces, sí</p>
<h1 class="small in">Cuando <span class="hl" data-say="cumple">se cumplió</span></h1>
<div class="case in" data-say="qualcomm">
  <p class="case-name">Qualcomm <small>Abril a agosto de 2024</small></p>
  <div class="plot mini"><canvas class="chart qcom"></canvas></div>
</div>
<div class="case in" data-say="coinbase">
  <p class="case-name">Coinbase <small>Agosto de 2021 a marzo de 2022</small></p>
  <div class="plot mini"><canvas class="chart coin"></canvas></div>
</div>
<p class="source">QCOM y COIN · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/candles-qcom.js"></script>
<script src="../data/candles-coin.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
for (const [symbol, cue] of [["QCOM", "qualcomm+0.8"], ["COIN", "coinbase+0.8"]]) {
  const c = CASES[symbol];
  reelChart(`canvas.chart.${symbol.toLowerCase()}`, {
    data: MORE_CANDLES[symbol], from: c.from, to: c.to,
    show: [{ to: c.to }],
    axis: { at: 0 },
    marks: caseMarks(symbol, { say: cue }),
  });
}
</script>
</body>
</html>
