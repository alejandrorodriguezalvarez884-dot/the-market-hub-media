<!doctype html>
<!-- Who it was, and when: the name and the axis come in -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El valor</p>
<div class="reveal pop" data-say="nvidia">
  <span class="logo"><img src="../../../theme/logos/nvidia.svg" alt="Nvidia"></span>
  <div><b>Nvidia</b><small>Junio a noviembre de 2023</small></div>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source in" data-say="nvidia">Nvidia (NVDA) · velas diarias ajustadas por splits · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.above }],
  axis: { say: "nvidia" },
  marks: [
    neckline(EPISODE.above, { at: 0, for: 0.01 }),
    { type: "level", price: EPISODE.headPrice, dash: true, color: "ink", at: 0, label: "50,27 $", labelAt: "2023-09-20", from: EPISODE.head },
  ],
}));
</script>
</body>
</html>
