<!doctype html>
<!-- The opinion: the bubble of 2000 burst, the internet did not -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<style>
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
  .pair .card { gap: 14px; }
  .pair h2 { font-size: 54px; }
</style>
</head>
<body class="light essay" data-bg="city">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Reflexión</header>
<main class="reel">
<p class="kicker in">Mi opinión</p>
<h1 class="small in">No es otra <span class="y">puntocom</span></h1>
<div class="pair">
  <div class="card down in" data-say="pincho">
    <p class="label">En 2000</p>
    <h2>Se pinchó la burbuja</h2>
  </div>
  <div class="card up in" data-say="internet">
    <p class="label">Pero</p>
    <h2>Internet, no</h2>
  </div>
</div>
<div class="card paper in" data-say="precios">
  <h2>Una caída desinfla <span class="y">precios</span>. No una tecnología con más de mil millones de usuarios.</h2>
</div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
