<!doctype html>
<!-- November 2022: the Fed's upper target from 0.25% to 4% (FRED, DFEDTARU), the Nasdaq 100 −29.5% and the S&P 500 −17% in the year to 29 Nov 2022 (Yahoo Finance) -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body class="light essay" data-bg="candles">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Reflexión</header>
<main class="reel">
<p class="kicker in">Noviembre de 2022</p>
<h1 class="small in">Un año <span class="y">horrible</span></h1>
<div class="card amber in" data-say="fed">
  <p class="label">Tipos de la Fed · techo de la horquilla · FRED</p>

<div class="card down in" data-say="nasdaq">
  <p class="label">En el año, al 29-11-2022 · Yahoo Finance</p>
  <div class="line"><span class="name">Nasdaq 100</span><span class="fig r" data-count="29.5" data-decimals="1" data-prefix="−" data-suffix=" %" data-say="treinta"></span></div>
  <div class="line"><span class="name">S&amp;P 500</span><span class="fig r">−17,0 %</span></div>
</div>
</main>
