<!doctype html>
<!-- Who it was, and when: the name and the axis come in -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El valor</p>
<div class="reveal pop" data-say="meta">
  <span class="logo"><img src="../../../theme/logos/meta.svg" alt="Meta"></span>
  <div><b>Meta</b><small>Abril a junio de 2023</small></div>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source in" data-say="meta">Meta Platforms (META) · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.end }],
  axis: { say: "meta" },
  marks: [
    flagLine("high", EPISODE.out, { at: 0, for: 0.01 }),
    flagLine("low", EPISODE.ask, { at: 0, for: 0.01 }),
    { type: "level", price: EPISODE.topPrice, dash: true, color: "ink", at: 0, label: "244,92 $", from: EPISODE.top },
  ],
}));
</script>
</body>
</html>
