<!doctype html>
<!-- October producer prices -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body data-bg="grid">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Apertura</header>
<main class="reel">
<p class="kicker in">Precios de producción · octubre</p>
<h1 class="in"><span class="y" data-count="6.5" data-prefix="+" data-decimals="1" data-suffix=" %" data-say="seis"></span></h1>
<div class="card in" data-say="suben">
  <div class="line" data-say="suben"><span class="name">En un año</span><span class="fig r">+6,5 %</span></div>
  <div class="line" data-say="suben"><span class="name">En el mes</span><span class="fig">+0,3 %</span></div>
  <p class="note">Oficina de Estadísticas Laborales de EE. UU. · 14:30 en España</p>
</div>
<span class="sticker amber pop" data-say="noviembre">La mayor desde nov. 2022</span>
</main>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
