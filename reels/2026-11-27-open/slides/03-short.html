<!doctype html>

<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Apertura</header>

<span class="sticker amber small pop" data-say="volumen">Poco volumen, movimientos más bruscos</span>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
