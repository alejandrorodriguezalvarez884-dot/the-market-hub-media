<!doctype html>

<html lang="es">
<head>

<link rel="stylesheet" href="../../../theme/reel.css">

<body class="light" data-bg="city">

<h1 class="small in">Eso no quiere decir que la bolsa <span class="r">no pueda caer</span></h1>
<div class="card paper in" data-say="exige">

</main>
<script src="../../../theme/reel.js"></script>
