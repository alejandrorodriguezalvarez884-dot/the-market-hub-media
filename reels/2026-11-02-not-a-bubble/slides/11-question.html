<!doctype html>
<!-- The closing question -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<style>
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
  .pair .card { gap: 14px; }
  .pair h2 { font-size: 50px; }
  .vs { font-size: 38px; font-weight: 700; color: var(--muted); }
</style>
</head>
<body class="light" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Reflexión</header>
<main class="reel center">
<p class="kicker in">¿Y tú qué ves?</p>
<div class="answers">
  <span class="sticker pop" data-say="burbuja">Burbuja</span>
  <em class="fade" data-say="o">o</em>
  <span class="sticker green pop" data-say="exigente">Mercado exigente</span>
</div>
<div class="mark in" data-say="comentarios"><img src="../../../channel/instagram-profile.jpg" alt=""><span>Te leo en comentarios</span></div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
