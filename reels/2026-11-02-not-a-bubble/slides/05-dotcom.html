<!doctype html>
<!-- 1999: adding .com to a name lifted a share 74% in ten days -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<style>
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
  .pair .card { gap: 14px; }
  .pair h2 { font-size: 50px; }
  .vs { font-size: 38px; font-weight: 700; color: var(--muted); }
</style>
</head>
<body class="light essay" data-bg="tape">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Reflexión</header>
<main class="reel">
<p class="kicker sky in">1999</p>
<h1 class="in">Bastaba con llamarse <span class="y">.com</span></h1>
<div class="card amber in" data-say="subia">
  <p class="label">Tras cambiar el nombre a .com</p>
  <div class="big"><span data-count="74" data-prefix="+" data-say="setenta"></span><small>%</small></div>
  <p class="note">De media, en 10 días · Cooper, Dimitrov y Rau (2001)</p>
</div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
