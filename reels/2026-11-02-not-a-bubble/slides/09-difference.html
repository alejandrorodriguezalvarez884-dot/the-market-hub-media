<!doctype html>
<!-- The difference: a bubble buys everything; today the market punishes spending without results -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<style>
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
  .pair .card { gap: 14px; }
  .pair h2 { font-size: 50px; }
  .vs { font-size: 38px; font-weight: 700; color: var(--muted); }
</style>
</head>
<body class="light" data-bg="grid">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Reflexión</header>
<main class="reel center">
<p class="kicker in">La diferencia</p>
<div class="pair">
  <div class="card down in" data-say="burbuja">
    <p class="label">En una burbuja</p>
    <h2>Se compra todo</h2>
  </div>
  <div class="card up in" data-say="hoy">
    <p class="label">Hoy</p>
    <h2>Se castiga gastar sin resultados</h2>
  </div>
</div>
<span class="sticker green pop" data-say="parece">No parece una burbuja</span>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
