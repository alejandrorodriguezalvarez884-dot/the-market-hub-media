<!doctype html>
<!-- The name and the dates: Microsoft, April to June 2026, with prices and months -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">El valor</p>
<div class="reveal pop" data-say="microsoft">
  <span class="logo"><img src="../../../theme/logos/microsoft.svg" alt="Microsoft"></span>
  <div><b>Microsoft</b><small>Abril a junio de 2026</small></div>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source in" data-say="microsoft">Microsoft (MSFT) · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.to }],
  axis: { say: "microsoft" },
  marks: [{ type: "level", price: EPISODE.line, at: 0, for: 0.01, label: "433,70 $" }],
}));
</script>
</body>
</html>
