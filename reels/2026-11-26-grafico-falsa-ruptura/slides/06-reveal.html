<!doctype html>
<!-- The answer: the candles after the question, back under the ceiling and down -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">La respuesta</p>
<h1 class="in">Una <span class="hl" data-say="falsa">falsa ruptura</span></h1>
<p class="secret">Valor <i></i> Fechas <i></i></p>
<div class="choices"><span class="sticker pop" data-say="otro">Cierra bajo el techo</span></div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }, { to: EPISODE.fall, say: "siguiente", for: 0.5 },
         { to: EPISODE.back, say: "otro", for: 0.5 }, { to: EPISODE.to, say: "semanas", for: 1.8 }],
  marks: [
    { type: "level", price: EPISODE.line, at: 0, for: 0.01, label: "Techo" },
    { type: "ring", day: EPISODE.back, where: "close", r: 26, color: "down", say: "otro" },
    { type: "note", day: EPISODE.end, price: "low", side: "below", text: "−23,4 % desde la pregunta", color: "down", say: "veintitres" },
  ],
}));
</script>
</body>
</html>
