<!doctype html>
<!-- A pattern is not a promise: everything a breakout asks for, and still it failed; and the fall was not the end either -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker red in">Ojo</p>
<h1 class="small in">Un patrón <span class="hl" data-say="promesa">no es una promesa</span></h1>
<div class="choices">
  <span class="sticker pop" data-say="fallo">Y falló</span>
  <span class="sticker green pop" data-say="julio">30 jul: otra vez encima</span>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Microsoft (MSFT) · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.to }],
  axis: { at: 0 },
  marks: [
    { type: "level", price: EPISODE.line, at: 0, for: 0.01, label: "433,70 $" },
    { type: "ring", day: EPISODE.jump, where: "close", r: 26, color: "up", say: "cierre" },
    { type: "ring", day: EPISODE.back, where: "close", r: 26, color: "down", say: "fallo" },
  ],
}));
</script>
</body>
</html>
