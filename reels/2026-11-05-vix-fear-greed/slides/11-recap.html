<!doctype html>
<!-- The recap: the VIX is the price of protection turned into an expected move; Fear & Greed, seven thermometers in one needle -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<style>
  .card h2 { font-size: 54px; }
  .card p.what { font-size: 38px; font-weight: 600; line-height: 1.2; color: var(--ink); }
</style>
</head>
<body class="light" data-bg="city" data-seed="9">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Aprende</header>
<main class="reel">
<p class="kicker in">Resumen</p>
<h1 class="small in">Dos <span class="y">termómetros</span></h1>
<div class="card amber in" data-say="vix">
  <p class="label">El VIX</p>
  <h2>Lo que cuesta protegerse</h2>
  <p class="what fade" data-say="protegerse">→ cuánto se espera que se mueva la bolsa en 30 días</p>
</div>
<div class="card in" data-say="fear">
  <p class="label">El Fear &amp; Greed</p>
  <h2>Siete termómetros, una aguja</h2>
  <p class="what fade" data-say="aguja">De 0, miedo extremo, a 100, codicia extrema</p>
</div>
<span class="sticker tag tilt pop" data-say="dicen como">Miden el ánimo, no el futuro</span>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
