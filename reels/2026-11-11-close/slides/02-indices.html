<!doctype html>
<!-- The three indices at the close (Yahoo Finance) -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body data-bg="tape">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Cierre</header>
<main class="reel">
<p class="kicker in">Al cierre · 22:00 en España</p>
<h1 class="small in">Los tres, en <span class="g">verde</span></h1>
<div class="card in" data-say="nasdaq">
  <div class="line" data-say="nasdaq"><span class="name">Nasdaq 100<small>28.374,25</small></span><span class="fig g" data-count="2.28" data-prefix="▲ " data-decimals="2" data-suffix=" %" data-say="nasdaq"></span><span class="bar"><i class="g" style="--w: 100%"></i></span></div>
  <div class="line" data-say="quinientos"><span class="name">S&amp;P 500<small>7.619,38</small></span><span class="fig g" data-count="1.31" data-decimals="2" data-prefix="▲ " data-suffix=" %" data-say="quinientos"></span><span class="bar"><i class="g" style="--w: 57%"></i></span></div>
  <div class="line" data-say="dow"><span class="name">Dow Jones<small>52.486,49 · +255 puntos</small></span><span class="fig g" data-count="0.49" data-decimals="2" data-prefix="▲ " data-suffix=" %" data-say="dow"></span><span class="bar"><i class="g" style="--w: 21%"></i></span></div>
  <p class="note">Frente al cierre del martes · Yahoo Finance</p>
</div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
