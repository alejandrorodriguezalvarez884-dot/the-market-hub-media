<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<!-- Hook: Dow best day since Apr 2025 (Wed), S&P 500 worst day since Apr 2025 (Thu); Yahoo daily history -->
<body data-bg="candles">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · La semana</header>
<main class="reel">
<p class="kicker in">Del 2 al 6 de noviembre</p>
<h1 class="in">Una semana de <span class="y">montaña rusa</span></h1>
<div class="card up in" data-say="miercoles">
  <div class="line"><span class="name">Miércoles · Dow Jones<small>Su mejor día desde abril de 2025</small></span><span class="fig g">▲ 3,0 %</span></div>
</div>
<div class="card down in" data-say="jueves">
  <div class="line"><span class="name">Jueves · S&amp;P 500<small>Su peor día desde abril de 2025</small></span><span class="fig r">▼ 4,4 %</span></div>
</div>
<span class="sticker tag pop" data-say="pasado">¿Qué ha pasado?</span>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
