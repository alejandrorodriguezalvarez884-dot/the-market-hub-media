<!doctype html>
<!-- Hook: try how your own trading bot would work, on paper, free and without code -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="league.css">
<style>
  h1 { font-size: 104px; }
  .play { width: 100%; display: flex; align-items: center; gap: 40px; }
  .me { position: relative; flex: none; }
  .me .robot { width: 300px; height: 300px; border-radius: 26px; outline: 6px solid var(--amber); }
  .me .name { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); white-space: nowrap; }
  .steps { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .steps .card { padding: 18px 24px; display: flex; align-items: center; gap: 18px; }
  .steps .card b { font-size: 38px; color: var(--ink-strong); font-weight: 700; }
  .steps .n { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--amber); color: var(--amber); display: grid;
              place-items: center; font-family: var(--mono); font-size: 26px; font-weight: 700; flex: none; }
  .steps .card:nth-child(2) { animation-delay: calc(var(--at) + 0.25s); }
  .steps .card:nth-child(3) { animation-delay: calc(var(--at) + 0.5s); }
  .row { flex-wrap: nowrap; gap: 14px; }
  .row .chip { font-size: 31px; padding: 12px 20px; gap: 10px; }
</style>
</head>
<body data-level="1">
<main class="stage">
  <p class="kicker">Un juego gratis de The Market Hub</p>
  <h1>¿Cómo funcionaría tu <span class="y">bot de trading</span>?</h1>
  <div class="play">
    <div class="me"><span class="robot" data-bot="tu-bot"></span><span class="tag name">Tu bot</span></div>
    <div class="steps">
      <div class="card in" data-say="probarlo"><span class="n">1</span><b>Tu idea</b></div>
      <div class="card in" data-say="probarlo"><span class="n">2</span><b>Sus reglas</b></div>
      <div class="card in" data-say="probarlo"><span class="n">3</span><b>Juega en papel</b></div>
    </div>
  </div>
  <div class="row">
    <span class="chip on pop" data-say="gratis"><svg class="tick"></svg>Gratis</span>
    <span class="chip on pop" data-say="dinero"><svg class="tick"></svg>Sin dinero real</span>
    <span class="chip on pop" data-say="programar"><svg class="tick"></svg>Sin programar</span>
  </div>
</main>
<p class="foot">Bot League: bots de reglas que juegan en papel, con los cierres de cada día. Sin bróker y sin órdenes.</p>
<script src="league.js"></script>
<script src="robots.js"></script>
<script src="../../../theme/reel.js"></script>
</body>
</html>
