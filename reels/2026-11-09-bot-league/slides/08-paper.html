<!doctype html>
<!-- It is a game: no broker, no orders, nothing to put in and nothing to win -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="league.css">
<style>
  .nos { width: 100%; display: flex; flex-direction: column; gap: 30px; }
  .no { display: flex; align-items: center; gap: 30px; font-size: 64px; font-weight: 700; color: var(--ink-strong); }
  .no i { width: 92px; height: 92px; border-radius: 16px; border: 3px solid var(--line-strong); display: grid; place-items: center; flex: none; }
  .no i svg { width: 40px; height: 40px; }
  .stamp { margin-top: 20px; align-self: center; font-size: 128px; font-weight: 900; white-space: nowrap; letter-spacing: -0.04em; color: var(--amber);
           border: 10px solid var(--amber); border-radius: 30px; padding: 4px 48px; transform: rotate(-4deg); }
  .stamp.pop { animation-name: stamp; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-4deg) scale(1.8); } to { opacity: 1; transform: rotate(-4deg) scale(1); } }
</style>
</head>
<body data-level="8">
<main class="stage">
  <p class="kicker">Solo en papel</p>
  <div class="nos">
    <p class="no in" data-say="broker"><i><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ff6b57" stroke-width="3.2" stroke-linecap="round"/></svg></i>Sin bróker</p>
    <p class="no in" data-say="ordenes"><i><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ff6b57" stroke-width="3.2" stroke-linecap="round"/></svg></i>Sin órdenes</p>
    <p class="no in" data-say="depositar"><i><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ff6b57" stroke-width="3.2" stroke-linecap="round"/></svg></i>Nada que depositar</p>
    <p class="no in" data-say="ganar"><i><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ff6b57" stroke-width="3.2" stroke-linecap="round"/></svg></i>Nada que ganar</p>
  </div>
  <p class="stamp pop" data-say="juego">Es un juego</p>
</main>
<p class="foot">Bot League no es asesoramiento de inversión ni una recomendación de comprar o vender nada.</p>
<script src="league.js"></script>
<script src="robots.js"></script>
<script src="../../../theme/reel.js"></script>
</body>
</html>
