<!doctype html>
<!-- The three things that make it: a strong fall before, two similar bottoms weeks apart, a ceiling between -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker in">Para que cuente</p>
<div class="checks">
  <p class="in" data-say="caida">Una caída fuerte antes</p>
  <p class="in" data-say="suelos">Dos suelos parecidos, a semanas</p>
  <p class="in" data-say="techo">Un techo en medio</p>
</div>
<div class="plot short"><canvas class="chart"></canvas></div>
<p class="source">Velas diarias reales · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.ask }],
  marks: [
    { type: "zone", from: EPISODE.from, to: EPISODE.low1, color: "down", label: "Más de la mitad, desde dic.", say: "mitad" },
    { type: "ring", day: EPISODE.low1, where: "low", r: 36, say: "suelos" },
    { type: "ring", day: EPISODE.low2, where: "low", r: 36, say: "suelos" },
    { type: "note", day: "2025-03-25", price: 214.25, side: "below", text: "1,3 % de diferencia", color: "ink", say: "uno" },
    { type: "level", price: EPISODE.line, say: "techo", label: "Techo", from: EPISODE.low1, for: 0.8 },
  ],
}));
</script>
</body>
</html>
