<!doctype html>
<!-- The three indices at 17:12 Spain (the portal's overview) -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
</head>
<body data-bg="tape">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Apertura</header>
<main class="reel">
<p class="kicker in">A las 17:12 en España</p>
<h1 class="small in">Los tres índices, <span class="g">arriba</span></h1>
<div class="card up in" data-say="dow">
  <div class="line" data-say="dow"><span class="name">Dow Jones</span><span class="fig g" data-count="0.99" data-decimals="2" data-prefix="+" data-suffix=" %" data-say="dow"></span><span class="bar"><i class="g" style="--w: 99%"></i></span></div>
  <div class="line" data-say="quinientos"><span class="name">S&amp;P 500</span><span class="fig g" data-count="0.67" data-decimals="2" data-prefix="+" data-suffix=" %" data-say="quinientos"></span><span class="bar"><i class="g" style="--w: 67%"></i></span></div>
  <div class="line" data-say="nasdaq"><span class="name">Nasdaq 100</span><span class="fig g" data-count="0.60" data-decimals="2" data-prefix="+" data-suffix=" %" data-say="nasdaq"></span><span class="bar"><i class="g" style="--w: 60%"></i></span></div>
  <p class="note">Frente al cierre del viernes · Yahoo Finance</p>
</div>
</main>
<script src="../../../theme/reel.js"></script>
</body>
</html>
