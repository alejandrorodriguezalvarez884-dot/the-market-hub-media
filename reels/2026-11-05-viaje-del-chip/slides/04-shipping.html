<!doctype html>
<!-- Still at stop 2: each machine costs about $250 million and travels packed in about 40 containers on cargo planes -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="journey.css">
<style>
  .price { gap: 6px; }
  .price .big { font-size: 150px; }
  .boxes { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; width: 100%; }
  .boxes i { display: block; height: 44px; border-radius: 6px; background: var(--c, #2f7fd6);
             background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 3px, transparent 3px 14px);
             opacity: 0; animation: box-in 0.35s cubic-bezier(0.3, 1.6, 0.5, 1) both; animation-delay: calc(var(--at) + var(--k) * 0.045s); }
  @keyframes box-in { from { opacity: 0; transform: translateY(-30px) scale(0.6); } to { opacity: 1; transform: none; } }
  .plane { width: 100%; height: 150px; position: relative; }
  .plane svg { position: absolute; left: 0; top: 0; width: 520px; height: 190px; overflow: visible;
               animation: fly 3.2s cubic-bezier(0.4, 0, 0.3, 1) both; animation-delay: var(--at); }
  @keyframes fly { from { transform: translate(-560px, 20px) rotate(-4deg); } to { transform: translate(330px, -40px) rotate(-8deg); } }
  .boxes-label { display: flex; align-items: baseline; gap: 16px; }
  .boxes-label b { font-size: 84px; font-weight: 800; color: var(--ink-strong); letter-spacing: -0.03em; }
  .boxes-label span { font-size: 38px; font-weight: 700; color: var(--ink-strong); }
</style>
</head>
<body class="light" data-bg="city" data-seed="4" data-stop="2" data-stay>
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Aprende</header>
<main class="reel">
<div class="route"></div>
<p class="kicker in">Parada 2 · El precio y el viaje</p>
<div class="card amber price in" data-say="cuesta">
  <p class="label">Cada máquina EUV · según Reuters</p>
  <div class="big"><span data-count="250" data-say="doscientos"></span><small>millones $</small></div>
</div>
<div class="boxes-label in" data-say="empaquetada"><b>~40</b><span>contenedores</span></div>
<div class="boxes" id="boxes" data-say="cuarenta"></div>

<span class="sticker tag pop" data-say="carga">En aviones de carga</span>
<div class="plane" data-say="aviones">
  <svg viewBox="0 0 520 190" aria-hidden="true">
    <path d="M 20 100 Q 20 70 70 68 L 430 60 Q 500 60 510 92 Q 500 118 430 118 L 70 120 Q 20 120 20 100 Z" style="fill: #fbf8f2; stroke: #15120d; stroke-width: 6"/>
    <path d="M 430 60 Q 470 58 500 80 L 470 82 Q 450 70 430 70 Z" style="fill: #15120d"/>
    <path d="M 220 90 L 330 90 L 230 180 L 180 180 Z" style="fill: #e3dccd; stroke: #15120d; stroke-width: 6"/>
    <path d="M 60 72 L 20 10 L 60 10 L 120 70 Z" style="fill: var(--amber); stroke: #15120d; stroke-width: 6"/>
    <g style="fill: var(--sky)"><circle cx="150" cy="90" r="7"/><circle cx="180" cy="90" r="7"/><circle cx="350" cy="88" r="7"/><circle cx="380" cy="88" r="7"/></g>
      </svg>
</div>
</main>
<script>
  const colors = ["#2f7fd6", "#e0442f", "#12925c", "#c27c00", "#7b4dd6"];
  document.getElementById("boxes").innerHTML = Array.from({ length: 40 }, (_, k) =>
    `<i style="--k:${k};--c:${colors[(k * 7) % colors.length]}"></i>`).join("");
</script>
<script src="journey.js"></script>
<script src="../../../theme/reel.js"></script>
</body>
</html>
