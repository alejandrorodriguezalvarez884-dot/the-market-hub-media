<!doctype html>
<!-- Stop 6, the model: trained there with thousands of chips at once; your question travels to one of those centres and the answer comes back -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="journey.css">
<style>
  .chips { display: grid; grid-template-columns: repeat(16, 1fr); gap: 7px; width: 100%; }
  .chips i { aspect-ratio: 1; border-radius: 5px; background: rgba(21, 18, 13, 0.12); animation: chip-on 1.6s ease-in-out infinite; animation-delay: calc(var(--at) + var(--k) * 0.03s); animation-play-state: running; }
  @keyframes chip-on { 0%, 100% { background: rgba(21, 18, 13, 0.12); } 40% { background: var(--amber); } }
  .trip { width: 100%; }
  .trip svg { width: 100%; height: auto; overflow: visible; display: block; }
  .go { offset-path: path("M 170 150 C 330 20 530 20 690 150"); offset-rotate: 0deg; opacity: 0;
        animation: go 1.1s ease-in-out both; animation-delay: var(--at); }
  .back { offset-path: path("M 690 190 C 530 320 330 320 170 190"); offset-rotate: 0deg; opacity: 0;
          animation: go 1.1s ease-in-out both; animation-delay: var(--at); }
  @keyframes go { 0% { offset-distance: 0%; opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  .arrive { opacity: 0; animation: reel-fade 0.4s ease both; animation-delay: calc(var(--at) + 1.3s); }
</style>
</head>
<body class="light" data-bg="grid" data-seed="9" data-stop="6">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Aprende</header>
<main class="reel">
<div class="route"></div>
<p class="kicker in">Parada 6 · El modelo</p>
<h1 class="in small">Se entrena con <span class="y">miles de chips</span></h1>
<div class="chips in" id="chips" data-say="entrena"></div>
<div class="trip in" data-say="escribes">
  <svg viewBox="0 0 860 340" aria-hidden="true">
    <!-- the phone -->
    <rect x="40" y="60" width="140" height="240" rx="26" style="fill: #15120d"/>
    <rect x="52" y="74" width="116" height="212" rx="16" style="fill: #fbf8f2"/>
    <rect x="72" y="100" width="80" height="34" rx="12" style="fill: var(--sky)"/>
    <rect class="arrive" data-say="vuelve" x="68" y="150" width="88" height="70" rx="12" style="fill: #e9e1d0"/>
    <text x="110" y="330" text-anchor="middle" style="fill: #15120d; font-size: 28px">Tú</text>
    <!-- the data centre -->
    <rect x="680" y="70" width="160" height="230" rx="12" style="fill: #2a2620; stroke: #15120d; stroke-width: 6"/>
    <g style="fill: #35c98f"><rect x="700" y="100" width="120" height="10" rx="3"/><rect x="700" y="140" width="120" height="10" rx="3"/><rect x="700" y="180" width="120" height="10" rx="3"/><rect x="700" y="220" width="120" height="10" rx="3"/></g>
    <text x="760" y="330" text-anchor="middle" style="fill: #15120d; font-size: 28px">Centro de datos</text>
    <!-- the paths -->
    <path d="M 170 150 C 330 20 530 20 690 150" style="fill: none; stroke: rgba(21,18,13,0.25); stroke-width: 4; stroke-dasharray: 12 12"/>
    <path d="M 690 190 C 530 320 330 320 170 190" style="fill: none; stroke: rgba(21,18,13,0.25); stroke-width: 4; stroke-dasharray: 12 12"/>
    <g class="go" data-say="viaja"><rect x="-60" y="-26" width="120" height="52" rx="18" style="fill: var(--sky)"/><text x="0" y="12" text-anchor="middle" style="fill: #fff; font-size: 32px">¿…?</text></g>
    <g class="back" data-say="vuelve"><rect x="-70" y="-26" width="140" height="52" rx="18" style="fill: var(--amber)"/><text x="0" y="12" text-anchor="middle" style="fill: #15120d; font-size: 28px">Respuesta</text></g>
  </svg>
</div>
</main>
<script>
  document.getElementById("chips").innerHTML = Array.from({ length: 64 }, (_, k) => `<i style="--k:${(k % 16) + Math.floor(k / 16) * 2}"></i>`).join("");
</script>
<script src="journey.js"></script>
<script src="../../../theme/reel.js"></script>
</body>
</html>
