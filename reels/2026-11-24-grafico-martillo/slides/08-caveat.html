<!doctype html>
<!-- The caveat: a pattern is not a promise -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/reel.css">
<link rel="stylesheet" href="../../../theme/chart.css">
</head>
<body class="light chart-reel" data-bg="plain">
<canvas class="bg"></canvas>
<header class="brand">The Market Hub · Lee el gráfico</header>
<main class="reel">
<p class="kicker red in">Ojo</p>
<h1 class="small in">Un patrón <span class="hl" data-say="promesa">no es una promesa</span></h1>
<div class="choices">
  <span class="sticker pop" data-say="vendedores">Quedan vendedores</span>
  <span class="sticker pop" data-say="abrio">Abre arriba, cierra abajo</span>
</div>
<div class="plot"><canvas class="chart"></canvas></div>
<p class="source">Amazon (AMZN) · velas diarias · Yahoo Finance</p>
</main>
<script src="../data/candles.js"></script>
<script src="../data/episode.js"></script>
<script src="../../../theme/reel.js"></script>
<script src="../../../theme/chart.js"></script>
<script>
reelChart("canvas.chart", chartOf({
  show: [{ to: EPISODE.to }],
  axis: { at: 0 },
  marks: [
    { type: "level", price: EPISODE.low, at: 0, for: 0.01, label: "204,16 $" },
    { type: "ring", day: EPISODE.ask, where: "low", r: 26, color: "down", say: "vendedores" },
    { type: "ring", day: EPISODE.next, where: "high", r: 30, color: "down", say: "abrio" },
  ],
}));
</script>
</body>
</html>
