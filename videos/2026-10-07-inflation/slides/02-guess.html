<!doctype html>
<!-- In 2000 the bill filled a basket with ten things. Does it still buy all ten, nine, seven? -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .bill, .basket { display: block; overflow: visible; }
  .guess { display: flex; align-items: center; gap: 3vw; }
  .then { flex: none; display: flex; flex-direction: column; gap: 2.4vh; width: 23vw; }
  .then > div { display: flex; flex-direction: column; gap: 1.4vh; }
  .bill { width: 22vw; }
  .eq { flex: none; font-size: 6vw; font-weight: 800; color: var(--pop); }
  .basket { width: 34vw; }
  .choices { display: flex; gap: 2vw; max-width: none; }
  .choices span { padding: 0.1em 0.5em; border: 0.3vw solid var(--pop); border-radius: 0.4em; font-size: 4.2vw; font-weight: 800;
                  letter-spacing: -0.03em; color: var(--ink-strong); }
  @media (orientation: portrait) {
    .slide { justify-content: flex-start; gap: 1.8vh; }
    .guess { flex-direction: column; align-items: flex-start; gap: 1.6vh; }
    .then { flex-direction: row; align-items: center; gap: 4vw; width: auto; }
    .bill { width: 30vw; }
    .eq { display: none; }
    .basket { width: 56vw; }
    .choices { gap: 3.4vw; }
    .choices span { font-size: 7.6vw; border-width: 0.6vw; }
  }
</style>
</head>
<body class="tone-ocean">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 02</span></header>

      <div>

<g transform="translate(136 202)"><g class="pop" data-say="ten+0.42"><circle r="27" fill="var(--sun)" stroke="rgba(15,12,46,0.35)" stroke-width="3"/><path d="M0 -27 q3 -12 14 -14" stroke="var(--mint)" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g transform="translate(210 202)"><g class="pop" data-say="ten+0.49"><rect x="-25" y="-25" width="50" height="52" rx="8" fill="var(--pink)" stroke="rgba(15,12,46,0.35)" stroke-width="3"/><rect x="-25" y="-9" width="50" height="13" fill="rgba(255,255,255,0.5)"/></g></g><g transform="translate(284 202)"><g class="pop" data-say="ten+0.56"><rect x="-8" y="-33" width="16" height="22" rx="4" fill="var(--sky)" stroke="rgba(15,12,46,0.35)" stroke-width="3"/><rect x="-18" y="-15" width="36" height="43" rx="9" fill="var(--sky)" stroke="rgba(15,12,46,0.35)" stroke-width="3"/></g></g><g transform="translate(358 202)"><g class="pop" data-say="ten+0.63"><circle r="27" fill="var(--violet)" stroke="rgba(15,12,46,0.35)" stroke-width="3"/><path d="M0 -27 q3 -12 14 -14" stroke="var(--mint)" stroke-width="5" stroke-linecap="round" fill="none"/></g></g></svg></div>
  </div>
  <p class="choices"><span class="pop" data-say="all">All 10?</span><span class="pop" data-say="nine">9?</span><span class="pop" data-say="seven">7?</span></p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<div class="presenter corner"></div>

</html>
