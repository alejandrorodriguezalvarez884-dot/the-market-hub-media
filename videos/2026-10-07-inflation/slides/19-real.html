<!doctype html>
<!-- Two words: nominal is the number, real is what the number buys. A price, a salary and a balance are nominal. -->
<html lang="en">
<head>

<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .bill, .basket { display: block; overflow: visible; height: 15vh; }
  .words { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; }
  .words .card { display: flex; flex-direction: column; align-items: flex-start; gap: 1.2vh; }
  .word { font-size: 5vw; line-height: 1; font-weight: 800; letter-spacing: -0.04em; color: var(--ink-strong); margin-top: 1vh; }
  .words .lead { font-size: 2.4vw; color: var(--muted); }
  .slide > .lead { max-width: none; }
</style>
</head>
