<!doctype html>
<!-- Two percent sounds like nothing: a hundred dollars becomes a hundred and two, a year later. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .sum { font-size: 6.2vw; flex-wrap: nowrap; }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 02</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in">2% sounds like <span class="hl" data-say="nothing">nothing</span></h2>
    <p class="sum"><span class="in" data-say="hundred">$100</span><span class="accent in" data-say="hundred#2">&rarr; $102</span></p>
    <p class="lead in" data-say="year">One year later.</p>
</main>
<div class="presenter" data-cues="0:open hundred:explain who:shrug"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
