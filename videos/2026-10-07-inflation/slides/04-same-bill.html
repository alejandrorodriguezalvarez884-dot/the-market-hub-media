<!doctype html>
<!-- Nobody touched the drawer: the bill is the same, and the prices around it went up. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  h2 { max-width: none; }

  }
</style>
</head>
