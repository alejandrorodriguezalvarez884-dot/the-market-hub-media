<!doctype html>
<!-- The presenter asks why a central bank wants 2 percent, and not zero. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .stage > .slide { gap: 1vh; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 02</span></header>
<div class="stage">
<main class="slide">
    <h1 class="in" data-say="why">Why <span class="accent">2%</span></h1>
    <h1 class="in" data-say="not"><span class="muted">and not</span> <span class="hl" data-say="zero">0%?</span></h1>
</main>
<div class="presenter" data-cues="0:open why:two zero:shrug"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
