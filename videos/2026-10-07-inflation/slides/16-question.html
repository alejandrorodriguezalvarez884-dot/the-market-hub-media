<!doctype html>
<!-- The presenter asks whether everybody gets poorer every year. No: only the bill in the drawer stands still. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .no { font-size: 9vw; line-height: 1; font-weight: 800; letter-spacing: -0.05em; color: var(--sun); }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 02</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in">Is everybody getting <span class="hl" data-say="poorer">poorer</span>?</h2>
    <p class="no pop" data-say="no">No.</p>
    <p class="lead in" data-say="only">Only the bill stands still.</p>
</main>
<div class="presenter" data-cues="0:shrug no:one bill:open"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
