<!doctype html>
<!-- Savings: 3 percent interest with prices up 2 is about 1 percent ahead; 1 percent with prices up 3 is about 2 percent behind. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .cases { display: flex; flex-direction: column; gap: 2.6vh; }
  .case { display: flex; align-items: center; gap: 1.4vw; max-width: none; }
  .case span { padding: 0.35em 0.7em; border-radius: 0.5em; font-size: 2.5vw; font-weight: 800; letter-spacing: -0.02em; color: var(--on-accent); white-space: nowrap; }
  .case .mint { background: var(--mint); }
  .case .coral { background: var(--sun); }
  .case b { margin-left: 1vw; font-size: 3.4vw; font-weight: 800; letter-spacing: -0.035em; white-space: nowrap; }
  .case b::before { content: "= "; color: var(--muted); }
  .lead { max-width: none; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 02</span></header>
<main class="slide room">
  <p class="kicker in">The same with savings</p>
  <div class="cases">
    <p class="case in" data-say="earn"><span class="mint">Interest +3%</span><span class="coral">Prices +2%</span><b class="up pop" data-say="one percent">about 1% ahead</b></p>
    <p class="case in" data-say="earn#2"><span class="mint">Interest +1%</span><span class="coral">Prices +3%</span><b class="down pop" data-say="two percent">about 2% behind</b></p>
  </div>
  <p class="lead in" data-say="even">The balance grew. <span class="hl" data-say="grew">It buys less.</span></p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic. Examples, not forecasts</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
