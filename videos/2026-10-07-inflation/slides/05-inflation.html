<!doctype html>
<!-- The name of it: inflation. Prices in general going up, so money, the ruler, measures less. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  h2 { max-width: none; font-size: 6vw; }
  .ruler { display: block; overflow: visible; width: 56vw; }
  .shrink { transform-box: fill-box; transform-origin: left; animation: shrink 1.8s cubic-bezier(0.4, 0, 0.3, 1) both; animation-delay: var(--at, 0s); }
  @keyframes shrink { to { transform: scaleX(0.55); } }
  @media (orientation: portrait) {
    .slide { justify-content: flex-start; gap: 2.4vh; }
    h2 { font-size: 10.4vw; }
    .ruler { width: 86vw; }
  }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 02</span></header>
<main class="slide room">
  <h2 class="pop" data-say="inflation">That's <span class="mark">inflation</span>.</h2>
  <p class="lead in" data-say="prices">Prices in general, going up.</p>
  <svg class="ruler fade" data-say="money-0.2" viewBox="0 0 820 130">
    <rect x="10" y="20" width="800" height="90" rx="12" fill="none" stroke="var(--snow)" stroke-width="3" stroke-dasharray="5 10" opacity="0.6"/>
    <g class="shrink" data-say="shrinking-0.5"><rect x="10" y="20" width="800" height="90" rx="12" fill="var(--sun)" stroke="rgba(15,12,46,0.4)" stroke-width="3"/><path d="M40 45 V75" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M77 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M114 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M151 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M188 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M225 45 V75" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M262 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M299 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M336 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M373 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M410 45 V75" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M447 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M484 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M521 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M558 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M595 45 V75" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M632 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M669 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M706 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M743 45 V62" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/><path d="M780 45 V75" stroke="#0f0c2e" stroke-width="4" stroke-linecap="round"/></g>
    <text x="34" y="98" font-size="30" style="fill: #0f0c2e">$1</text>
  </svg>
  <p class="lead in" data-say="ruler">Money is the ruler. <span class="hl" data-say="shrinking">It keeps shrinking.</span></p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
