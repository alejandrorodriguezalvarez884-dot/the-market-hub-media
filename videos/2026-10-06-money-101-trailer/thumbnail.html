<!doctype html>
<!-- The thumbnail: the series' name, one line under it, and the presenter. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../theme/slide.css">
<style>
  .name { font-size: 15vw; max-width: none; white-space: nowrap; }
  body.thumbnail { padding-bottom: 0; }
  .lead { font-size: 4.2vw; white-space: nowrap; }
</style>
</head>
<body class="thumbnail tone-plum">
<div class="stage">
  <main class="slide">
    <span class="chip solid" style="align-self: flex-start">New series</span>
    <h1 class="name">Money <span class="mark">101</span></h1>
    <p class="lead">How money really works.</p>
  </main>
  <div class="presenter" data-cues="-2:wave"></div>
</div>
<script src="../../theme/presenter.js"></script>
<script src="../../theme/slide.js"></script>
</body>
</html>
