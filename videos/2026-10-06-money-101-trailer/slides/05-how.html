<!doctype html>
<!-- How the series teaches: first something you can picture (a pond, a snowball, a stack of blocks), then the numbers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  h2 { max-width: none; }
  .shows { display: flex; gap: 1.6vw; }
  .shows .card { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.6vh; padding: 2.4vh 1.6vw 2.6vh;
                 font-size: 2.3vw; font-weight: 800; letter-spacing: -0.03em; color: var(--ink-strong); }
  .shows svg { display: block; width: 100%; }
  .slide { padding-right: 16vw; }
  @media (orientation: portrait) {
    .slide { padding-right: 0; justify-content: flex-start; gap: 2.4vh; }
    h2 { font-size: 8.4vw; }
    .shows { gap: 2.2vw; }
    .shows .card { padding: 1.2vh 2.2vw 1.4vh; gap: 0.8vh; font-size: 4vw; border-radius: 2.4vw; }
    .lead { font-size: 6vw; }
  }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101</span></header>
<main class="slide">
  <h2 class="in" data-say="we start">First, <span class="accent">picture it</span>.</h2>
  <div class="shows">
    <div class="card pop" data-say="pond">
      <svg viewBox="0 0 420 230">
        <rect x="6" y="6" width="408" height="218" rx="46" fill="#1478c2" stroke="var(--sky)" stroke-width="6"/>
        <g fill="var(--mint)" stroke="#12966a" stroke-width="3" stroke-linejoin="round"><path d="M42 43 L60.5 35.5 A20 20 0 1 0 60.5 50.5 Z"/><path d="M42 91 L60.5 83.5 A20 20 0 1 0 60.5 98.5 Z"/><path d="M42 139 L60.5 131.5 A20 20 0 1 0 60.5 146.5 Z"/><path d="M42 187 L60.5 179.5 A20 20 0 1 0 60.5 194.5 Z"/><path d="M90 43 L108.5 35.5 A20 20 0 1 0 108.5 50.5 Z"/><path d="M90 91 L108.5 83.5 A20 20 0 1 0 108.5 98.5 Z"/><path d="M90 139 L108.5 131.5 A20 20 0 1 0 108.5 146.5 Z"/><path d="M90 187 L108.5 179.5 A20 20 0 1 0 108.5 194.5 Z"/><path d="M138 43 L156.5 35.5 A20 20 0 1 0 156.5 50.5 Z"/><path d="M138 91 L156.5 83.5 A20 20 0 1 0 156.5 98.5 Z"/><path d="M138 139 L156.5 131.5 A20 20 0 1 0 156.5 146.5 Z"/><path d="M138 187 L156.5 179.5 A20 20 0 1 0 156.5 194.5 Z"/><path d="M186 43 L204.5 35.5 A20 20 0 1 0 204.5 50.5 Z"/><path d="M186 91 L204.5 83.5 A20 20 0 1 0 204.5 98.5 Z"/><path d="M186 139 L204.5 131.5 A20 20 0 1 0 204.5 146.5 Z"/><path d="M186 187 L204.5 179.5 A20 20 0 1 0 204.5 194.5 Z"/></g>
      </svg>
      A pond
    </div>
    <div class="card pop" data-say="snowball">
      <svg viewBox="0 0 420 230">
        <path d="M10 40 L410 190 L410 230 L10 230 Z" fill="rgba(255,255,255,0.12)"/>
        <path d="M10 40 L410 190" stroke="var(--snow)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="70" cy="46" r="13" fill="var(--snow)"/><circle cx="170" cy="71" r="27" fill="var(--snow)"/><circle cx="318" cy="98" r="54" fill="var(--snow)"/>
      </svg>
      A snowball
    </div>
    <div class="card pop" data-say="stack">
      <svg viewBox="0 0 420 230"><g fill="var(--sky)"><rect x="38" y="188" width="56" height="32" rx="7"/><rect x="108" y="188" width="56" height="32" rx="7"/><rect x="108" y="150" width="56" height="32" rx="7"/><rect x="178" y="188" width="56" height="32" rx="7"/><rect x="178" y="150" width="56" height="32" rx="7"/><rect x="178" y="112" width="56" height="32" rx="7"/><rect x="248" y="188" width="56" height="32" rx="7"/><rect x="248" y="150" width="56" height="32" rx="7"/><rect x="248" y="112" width="56" height="32" rx="7"/><rect x="248" y="74" width="56" height="32" rx="7"/><rect x="318" y="188" width="56" height="32" rx="7"/><rect x="318" y="150" width="56" height="32" rx="7"/><rect x="318" y="112" width="56" height="32" rx="7"/><rect x="318" y="74" width="56" height="32" rx="7"/><rect x="318" y="36" width="56" height="32" rx="7"/></g><path d="M24 226 H396" stroke="var(--line-strong)" stroke-width="3"/></svg>
      A stack of blocks
    </div>
  </div>
  <p class="lead in" data-say="then">Then the numbers <span class="hl" data-say="make">make sense</span>.</p>
</main>
<div class="presenter corner"></div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
