<!doctype html>
<!-- The close: start from the beginning, and a drawn button that says subscribe. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .button svg { width: 1.1em; height: 1.1em; }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101</span></header>
<div class="stage">
  <main class="slide">
    <h1 class="in" data-say="start">Start from <span class="mark">zero</span>.</h1>
    <span class="button pop" data-say="subscribe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17 V11 a6 6 0 0 1 12 0 V17 l2 2 H4 Z"/><path d="M10 21.5 h4"/></svg>
      Subscribe
    </span>
  </main>
  <div class="presenter" data-cues="0:open subscribe:thumb"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
