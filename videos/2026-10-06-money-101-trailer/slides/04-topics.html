<!doctype html>
<!-- What the series covers: six subjects, each a small drawing, coming in as the voice names them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .slide { gap: 4.4vh; }
  .tile { padding: 4.6vh 2vw; font-size: 3vw; gap: 1.6vw; }
  .tile svg { width: 6vw; height: 6vw; }
  .lead { font-size: 3.6vw; }
  .lead .hl { white-space: nowrap; }
  @media (orientation: portrait) {
    .slide { justify-content: flex-start; gap: 2.2vh; }
    .lead { font-size: 5.6vw; }
    .lead .hl { display: inline-block; margin-top: 0.4vh; }
    .tile { flex-direction: row; align-items: center; gap: 3vw; padding: 1.5vh 3vw; font-size: 4.3vw; }
    .tile svg { width: 8vw; height: 8vw; }
  }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101</span></header>
<main class="slide">
  <div class="tiles">
    <div class="tile pop" data-say="compound"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 42 H42 M6 42 V6"/><path d="M8 38 C22 37 34 30 40 8"/><circle cx="40" cy="8" r="2.6" fill="var(--accent)"/></svg>Compound interest</div>
    <div class="tile pop" data-say="inflation"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 H42 V23 L22 43 L5 26 Z"/><circle cx="34" cy="13" r="2.8"/><path d="M17 26 L24 33 M22 21 L29 28"/></svg>Inflation</div>
    <div class="tile pop" data-say="debt"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="40" height="28" rx="5"/><path d="M4 19 H44 M11 30 H20"/></svg>Debt</div>
    <div class="tile pop" data-say="budgets"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M24 24 V6 M24 24 L39.5 33 M24 24 L10 35"/></svg>Budgets</div>
    <div class="tile pop" data-say="index"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 42 H43"/><rect x="9" y="26" width="7" height="16"/><rect x="20.5" y="15" width="7" height="27"/><rect x="32" y="7" width="7" height="35"/></svg>Index funds</div>
    <div class="tile pop" data-say="taxes"><svg viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 H38 V43 L33 39 L28.5 43 L24 39 L19.5 43 L15 39 L10 43 Z"/><path d="M18 27 L30 15"/><circle cx="19" cy="16" r="2.4"/><circle cx="29" cy="26" r="2.4"/></svg>Taxes</div>
  </div>
  <p class="lead in" data-say="all in">Plain English. <span class="hl" data-say="numbers">Numbers you can see.</span></p>
</main>
<div class="presenter corner"></div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
