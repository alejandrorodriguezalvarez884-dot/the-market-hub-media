<!doctype html>
<!-- The series: its name, as large as the frame takes, and what it is in two lines. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .name { font-size: 9.4vw; max-width: none; white-space: nowrap; }
  @media (orientation: portrait) { .name { font-size: 16.5vw; } .slide .lead { font-size: 5.6vw; } }
</style>
</head>
<body>
<header class="top"><span class="chip in" data-series>Money 101</span></header>
<div class="stage">
  <main class="slide">
    <p class="kicker in" data-say="welcome">A series from The Market Hub</p>
    <h1 class="name pop" data-say="money">Money <span class="mark">101</span></h1>
    <p class="lead in" data-say="short videos">How money really works.<br><span class="accent in" data-say="one idea">One idea at a time.</span></p>
  </main>
  <div class="presenter" data-cues="0:open money:point short:explain one_idea:one"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
