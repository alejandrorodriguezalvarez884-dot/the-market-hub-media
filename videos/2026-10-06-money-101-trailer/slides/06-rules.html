<!doctype html>
<!-- The three rules of the series, counted on the presenter's fingers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  @media (orientation: portrait) { h2 { font-size: 9vw; } .steps { gap: 1.1vh; } .step { font-size: 5.3vw; } }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101</span></header>
<div class="stage">
  <main class="slide">
    <h2 class="in" data-say="three">Three rules.</h2>
    <div class="steps">
      <p class="step in" data-say="one"><span class="n">01</span>Every number has a source</p>
      <p class="step in" data-say="two"><span class="n">02</span>No hype</p>
      <p class="step in" data-say="three#2"><span class="n">03</span>We explain. <span class="hl" data-say="you decide">You decide.</span></p>
    </div>
  </main>
  <div class="presenter" data-cues="0:open one:one two:two three#2:three we:explain"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
