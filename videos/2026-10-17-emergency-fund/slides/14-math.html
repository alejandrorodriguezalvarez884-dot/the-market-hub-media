<!doctype html>
<!-- A 1,000-dollar repair on that card, paid off in twelve equal monthly payments: about 120 dollars of interest. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .col { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; }
  .gone { animation: gone 0.45s ease both; animation-delay: var(--at, 0s); }
  @keyframes gone { to { opacity: 0; } }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 06</span></header>
<main class="slide room">
<p class="kicker in">A $1,000 repair &middot; on the card &middot; 12 monthly payments</p>
<p class="sum"><span class="in" data-say="thousand">$1,000</span><span class="accent in" data-say="hundred">+ $120</span></p>
<p class="figure-label in" data-say="hundred">of interest</p>
<h2 class="in" data-say="cost">The repair cost <span class="hl" data-say="more">more</span> than the repair.</h2>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Worked out here: 22% a year, 12 equal payments of about $93.59</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
