<!doctype html>
<!-- The CFPB's examples: a car repair, a home repair, a medical bill, a loss of income. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .col { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; }
  .gone { animation: gone 0.45s ease both; animation-delay: var(--at, 0s); }
  @keyframes gone { to { opacity: 0; } }
  .tiles { grid-template-columns: repeat(2, 1fr); gap: 2vw; }
  .tile { font-size: 3vw; padding: 4vh 2vw; gap: 2vw; }
  .tile svg { width: 6vw; height: 6vw; }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 06</span></header>
<main class="slide room">
<p class="kicker in">Its examples</p>
<div class="tiles">
  <div class="tile pop" data-say="car"><svg viewBox="0 0 48 48"><path d="M10 22 L15 13 H33 L38 22 Z" fill="var(--sky)"/><rect x="5" y="21" width="38" height="13" rx="5" fill="var(--sky)"/><circle cx="14" cy="35" r="5" fill="#15112e"/><circle cx="34" cy="35" r="5" fill="#15112e"/></svg><span>A car repair</span></div>
  <div class="tile pop" data-say="home"><svg viewBox="0 0 48 48"><path d="M6 22 L24 7 L42 22 V42 H6 Z" fill="var(--coral)"/><rect x="19" y="28" width="10" height="14" fill="var(--on-accent)"/></svg><span>A home repair</span></div>
  <div class="tile pop" data-say="medical"><svg viewBox="0 0 48 48"><rect x="6" y="6" width="36" height="36" rx="9" fill="var(--snow)"/><path d="M24 13 V35 M13 24 H35" stroke="var(--coral)" stroke-width="7" stroke-linecap="round"/></svg><span>A medical bill</span></div>
  <div class="tile pop" data-say="losing"><svg viewBox="0 0 48 48"><rect x="4" y="12" width="40" height="24" rx="5" fill="var(--mint)"/><circle cx="24" cy="24" r="6" fill="var(--on-accent)"/><path d="M8 42 L40 6" stroke="var(--coral)" stroke-width="5" stroke-linecap="round"/></svg><span>Losing your income</span></div>
</div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Source: CFPB, An essential guide to building an emergency fund</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
