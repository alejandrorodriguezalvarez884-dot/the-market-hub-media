<!doctype html>
<!-- When the fund is used, that is its job: the spare goes on, then a new one. The fund gets refilled, a little at a time. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .col { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; }
  .gone { animation: gone 0.45s ease both; animation-delay: var(--at, 0s); }
  @keyframes gone { to { opacity: 0; } }
  .gauge { width: 30vw; overflow: visible; }
</style>
</head>
<body class="tone-ocean">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 06</span></header>
<main class="slide room">
<svg class="gauge" viewBox="0 0 400 200">
  <rect x="6" y="26" width="370" height="148" rx="20" fill="none" stroke="var(--line-strong)" stroke-width="6"/><rect x="376" y="76" width="16" height="48" rx="5" fill="var(--line-strong)"/>
  <rect x="20" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="gone" data-say="used" x="92" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="gone" data-say="used" x="164" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="gone" data-say="used" x="236" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="gone" data-say="used" x="308" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="pop" data-say="refilled+0.00" x="92" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="pop" data-say="refilled+0.25" x="164" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="pop" data-say="refilled+0.50" x="236" y="40" width="60" height="120" rx="10" fill="var(--pop)"/><rect class="pop" data-say="refilled+0.75" x="308" y="40" width="60" height="120" rx="10" fill="var(--pop)"/>
</svg>
<h2 class="in" data-say="failure">Used is not <span class="hl" data-say="job">failed</span>. It&rsquo;s the job.</h2>
<p class="lead in" data-say="refilled">Then refilled, a little at a time.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
