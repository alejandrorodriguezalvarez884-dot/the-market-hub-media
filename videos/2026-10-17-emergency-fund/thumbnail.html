<!doctype html>
<!-- The thumbnail: the emergency fund as money's spare tire, a tire, and the presenter. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../theme/slide.css">
<style>
  body.thumbnail { padding-bottom: 0; }
  body.thumbnail h1 { font-size: 10vw; max-width: none; line-height: 0.98; }
  .tire { display: block; width: 14vw; overflow: visible; }
</style>
</head>
<body class="thumbnail tone-plum">
<div class="stage">
  <main class="slide">
    <span class="chip solid" style="align-self: flex-start" data-series>Money 101</span>
    <h1>Money&rsquo;s <span class="mark">spare tire</span></h1>
    <svg class="tire" viewBox="0 0 200 200"><g ><circle cx="100" cy="100" r="96" fill="#15112e"/><circle cx="100" cy="100" r="76.8" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="7.7"/><circle cx="100" cy="100" r="48.0" fill="var(--snow)"/><circle cx="100" cy="100" r="16.3" fill="var(--violet)"/></g></svg>
  </main>
  <div class="presenter" data-cues="-2:point"></div>
</div>
<script src="../../theme/presenter.js"></script>
<script src="../../theme/slide.js"></script>
</body>
</html>
