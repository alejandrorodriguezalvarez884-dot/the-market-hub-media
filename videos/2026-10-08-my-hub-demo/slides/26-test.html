<!doctype html>
<!-- What the viewer is asked to test: five things, each coming in on its number. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .slide { gap: 2.6vh; }
  .steps { gap: 1.7vh; }
  .step { font-size: 2.8vw; }
</style>
</head>
<body>
<header class="top"><span class="chip">My Hub · Demo</span></header>
<main class="slide room">
  <p class="kicker in">Your turn</p>
  <h2 class="in">What to <span class="hl" data-say="do">test</span></h2>
  <div class="steps">
    <div class="step in" data-say="one"><span class="n">1</span>Sign in and add a few stocks</div>
    <div class="step in" data-say="two"><span class="n">2</span>Read Overview and Analysis: do the numbers add up?</div>
    <div class="step in" data-say="three"><span class="n">3</span>Play with the Watchlist</div>
    <div class="step in" data-say="four"><span class="n">4</span>Share a portfolio, enter November</div>
    <div class="step in" data-say="five"><span class="n">5</span>Open at least one tool</div>
  </div>
</main>
<div class="presenter corner"></div>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
