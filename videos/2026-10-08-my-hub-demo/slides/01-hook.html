<!doctype html>
<!-- The hook: the presenter says what My Hub is, what the video shows and that a favour comes at the end. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
</head>
<body>
<header class="top"><span class="chip">My Hub · Demo</span></header>
<div class="stage">
  <main class="slide">
    <p class="kicker in">Market Hub · the private side</p>
    <h1 class="in">My Hub, in <span class="hl" data-say="seven">seven minutes</span></h1>
    <p class="lead in" data-say="everything">Everything it does today.<br>And what to <span class="accent">test</span>.</p>
  </main>
  <div class="presenter" data-cues="0:wave private:explain everything:open favour:one"></div>
</div>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
