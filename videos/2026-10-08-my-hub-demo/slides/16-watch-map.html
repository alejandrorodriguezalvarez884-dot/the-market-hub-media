<!doctype html>
<!-- Watchlist, Map: every stock on one plane, and the reading that opens from a dot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<link rel="stylesheet" href="../../../theme/tour.css">
</head>
<body class="tour tone-ember">
<header class="top"><span class="chip">My Hub · Demo</span><span class="part">4 of 7 · Watchlist</span></header>
<main class="slide tour-row">
  <figure class="screen">
    <div class="bar"><i></i><i></i><i></i><span>themarkethub.app/watchlist</span></div>
    <div class="view">
      <div class="shot" data-cam="0:60,50,1.26 left:60,70,1.3"><img src="shots/watch-map.jpg" alt="">
      </div>
      <div class="shot fade" data-say="press+0.3" data-cam="0:60,70,1.3 opens:72,50,1.45"><img src="shots/watch-drawer.jpg" alt="">
      </div>
    </div>
  </figure>
  <aside class="notes">
    <p class="kicker">Watchlist</p>
    <h2>All of it on one map</h2>
    <ul class="points">
      <li class="in" data-say="left">Across: distance from the 50-day average</li>
      <li class="in" data-say="bottom">Up: against the index, 3 months</li>
      <li class="in" data-say="press">Press a dot for its reading</li>
    </ul>
    <p class="try in" data-say="opens"><b>Try it</b>Open a reading from the map.</p>
  </aside>
</main>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Demo account · real prices, close of Oct 7, 2026 (Yahoo Finance)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
<script src="../../../theme/tour.js"></script>
</body>
</html>
