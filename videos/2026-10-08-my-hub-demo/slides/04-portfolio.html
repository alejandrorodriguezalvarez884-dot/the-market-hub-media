<!doctype html>
<!-- Portfolio: search a company and add it, with its shares and, optionally, its average cost. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<link rel="stylesheet" href="../../../theme/tour.css">
</head>
<body class="tour tone-forest">
<header class="top"><span class="chip">My Hub · Demo</span><span class="part">1 of 7 · Getting in</span></header>
<main class="slide tour-row">
  <figure class="screen">
    <div class="bar"><i></i><i></i><i></i><span>themarkethub.app/portfolio</span></div>
    <div class="view">
      <div class="shot" data-cam="0:60,50,1.26 search:52,36,1.7 shares:62,62,1.5"><img src="shots/portfolio-search.jpg" alt="">
        <i class="spot" data-say="search" data-off="position" style="--x:22.6; --y:29; --w:35.5; --h:15"></i>
        <i class="spot" data-say="shares" data-off="average" style="--x:50.4; --y:43; --w:10; --h:44"></i>
        <i class="spot" data-say="average" style="--x:75.3; --y:43; --w:10; --h:44"></i>
      </div>
    </div>
  </figure>
  <aside class="notes">
    <p class="kicker">Portfolio</p>
    <h2>Add what you hold</h2>
    <ul class="points">
      <li class="in" data-say="search">Search by name or ticker</li>
      <li class="in" data-say="shares">Shares you hold</li>
      <li class="in" data-say="optional">Average cost: optional</li>
    </ul>
  </aside>
</main>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Demo account · real prices, close of Oct 7, 2026 (Yahoo Finance)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
<script src="../../../theme/tour.js"></script>
</body>
</html>
