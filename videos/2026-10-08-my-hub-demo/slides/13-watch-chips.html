<!doctype html>
<!-- Watchlist: the chips that choose the stocks, and looking at any other stock. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<link rel="stylesheet" href="../../../theme/tour.css">
</head>
<body class="tour tone-ember">
<header class="top"><span class="chip">My Hub · Demo</span><span class="part">4 of 7 · Watchlist</span></header>
<main class="slide tour-row">
  <figure class="screen">
    <div class="bar"><i></i><i></i><i></i><span>themarkethub.app/watchlist</span></div>
    <div class="view">
      <div class="shot" data-cam="0:60,50,1.26 chip:50,30,1.7 look:72,32,1.8"><img src="shots/watch-look.jpg" alt="">
        <i class="spot" data-say="chip" data-off="bring" style="--x:29; --y:21.3; --w:27; --h:4.6"></i>
        <i class="spot" data-say="bring" data-off="look" style="--x:29; --y:25.4; --w:39.5; --h:4.6"></i>
        <i class="spot" data-say="look" style="--x:71.5; --y:21; --w:26; --h:14.5"></i>
      </div>
    </div>
  </figure>
  <aside class="notes">
    <p class="kicker">Watchlist</p>
    <h2>Pick what you see</h2>
    <ul class="points">
      <li class="in" data-say="chip">Chips switch stocks on and off</li>
      <li class="in" data-say="bring">Bring in what you hold</li>
      <li class="in" data-say="look">Or any other stock</li>
    </ul>
    <p class="try in" data-say="any"><b>Try it</b>Look up a stock you do not follow.</p>
  </aside>
</main>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Demo account · real prices, close of Oct 7, 2026 (Yahoo Finance)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
<script src="../../../theme/tour.js"></script>
</body>
</html>
