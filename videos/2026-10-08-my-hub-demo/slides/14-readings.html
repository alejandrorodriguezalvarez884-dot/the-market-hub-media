<!doctype html>
<!-- Watchlist, Readings: one sentence per stock and a gauge for each angle. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<link rel="stylesheet" href="../../../theme/tour.css">
</head>
<body class="tour tone-ember">
<header class="top"><span class="chip">My Hub · Demo</span><span class="part">4 of 7 · Watchlist</span></header>
<main class="slide tour-row">
  <figure class="screen">
    <div class="bar"><i></i><i></i><i></i><span>themarkethub.app/watchlist</span></div>
    <div class="view">
      <div class="shot" data-cam="0:60,50,1.26 readings:40,42,1.8 sentence:58,60,1.4 gauge:60,75,1.3"><img src="shots/watch-readings.jpg" alt="">
        <i class="spot" data-say="readings" data-off="each" style="--x:27; --y:36.3; --w:5.6; --h:4.8"></i>
        <i class="spot" data-say="sentence" data-off="gauge" style="--x:22; --y:49.5; --w:60; --h:8.5"></i>
        <i class="spot" data-say="price" data-off="trend" style="--x:21.5; --y:58.5; --w:24.5; --h:41"></i>
        <i class="spot" data-say="trend" data-off="strength" style="--x:46.5; --y:58.5; --w:24.5; --h:41"></i>
        <i class="spot" data-say="strength" style="--x:72; --y:58.5; --w:26; --h:41"></i>
      </div>
    </div>
  </figure>
  <aside class="notes">
    <p class="kicker">Watchlist</p>
    <h2>Each stock, read</h2>
    <ul class="points">
      <li class="in" data-say="sentence">One sentence per stock</li>
      <li class="in" data-say="price">Price against its 50-day average</li>
      <li class="in" data-say="trend">Trend</li>
      <li class="in" data-say="strength">Strength against the index</li>
    </ul>
  </aside>
</main>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Demo account · real prices, close of Oct 7, 2026 (Yahoo Finance)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
<script src="../../../theme/tour.js"></script>
</body>
</html>
