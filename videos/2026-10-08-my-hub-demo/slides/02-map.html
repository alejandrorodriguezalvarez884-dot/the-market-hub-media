<!doctype html>
<!-- What is inside My Hub: its four pages, the tools and the page of the account, each coming in as it is named. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .slide { gap: 3.4vh; }
  .tiles { margin-bottom: 13vh; }
  .tile { padding: 3.6vh 1.8vw; font-size: 2.6vw; gap: 1.4vw; }
  .tile svg { width: 5vw; height: 5vw; }
  .tile small { display: block; margin-top: 0.5vh; font-size: 1.25vw; font-weight: 600; letter-spacing: 0; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><span class="chip">My Hub · Demo</span></header>
<main class="slide">
  <p class="kicker in">What is inside</p>
  <div class="tiles">
    <div class="tile pop" data-say="overview"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke="var(--sky)"><path d="M3 13h6V3H3v10Zm0 8h6v-6H3v6Zm8 0h10V11H11v10Zm0-18v6h10V3H11Z"/></svg><div>Overview<small>your portfolio today</small></div></div>
    <div class="tile pop" data-say="analysis"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke="var(--pink)"><path d="M12 3a9 9 0 1 0 9 9h-9V3Zm3 .5A9 9 0 0 1 20.5 9H15V3.5Z"/></svg><div>Analysis<small>taken apart</small></div></div>
    <div class="tile pop" data-say="watchlist"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke="var(--coral)"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg><div>Watchlist<small>charts, readings, a map</small></div></div>
    <div class="tile pop" data-say="community"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke="var(--mint)"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 20a6 6 0 0 1 12 0m1.5-5.5A6 6 0 0 1 22 20"/></svg><div>Community<small>sharing, and a monthly game</small></div></div>
    <div class="tile pop" data-say="tools"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke="var(--sun)"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg><div>Four tools<small>to dig into a company</small></div></div>
    <div class="tile pop" data-say="page#2"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke="var(--violet)"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9a7 7 0 0 1 14 0"/></svg><div>Account and data<small>see it, delete it</small></div></div>
  </div>
</main>
<div class="presenter corner"></div>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">themarkethub.app</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
