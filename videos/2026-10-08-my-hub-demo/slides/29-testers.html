<!doctype html>
<!-- What the store asks before a new app goes in: twelve testers, fourteen days in a row. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .row { align-items: flex-end; gap: 5vw; }
  .row > * { flex: none; }
  .figure { font-size: 15vw; }
  .figure.accent { color: var(--pop); }
  .lead { margin-top: 1vh; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip">My Hub · Demo</span></header>
<main class="slide room">
  <p class="kicker in">Before the app can be in the store</p>
  <div class="row">
    <div class="in" data-say="twelve"><div class="figure accent" data-count="12" data-say="twelve" data-for="0.8"></div><p class="figure-label">testers</p></div>
    <div class="in" data-say="fourteen"><div class="figure" data-count="14" data-say="fourteen" data-for="0.8"></div><p class="figure-label">days in a row</p></div>
  </div>
  <p class="lead in" data-say="need">I need <span class="hl" data-say="testers">twelve testers</span>. Will you be one?</p>
</main>
<div class="presenter corner"></div>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Google Play asks this of new personal developer accounts</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
