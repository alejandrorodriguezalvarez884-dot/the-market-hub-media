<!doctype html>
<!-- Portfolio, further down: the watchlist, and the button that saves it all. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<link rel="stylesheet" href="../../../theme/tour.css">
</head>
<body class="tour tone-forest">
<header class="top"><span class="chip">My Hub · Demo</span><span class="part">1 of 7 · Getting in</span></header>
<main class="slide tour-row">
  <figure class="screen">
    <div class="bar"><i></i><i></i><i></i><span>themarkethub.app/portfolio</span></div>
    <div class="view">
      <div class="shot" data-cam="0:60,50,1.26 watchlist:48,60,1.7"><img src="shots/portfolio-watchlist.jpg" alt="">
        <i class="spot" data-say="handful" data-off="save" style="--x:22; --y:57; --w:37; --h:6.5"></i>
        <i class="spot" data-say="save" style="--x:21.6; --y:66.8; --w:18.5; --h:7"></i>
      </div>
    </div>
  </figure>
  <aside class="notes">
    <p class="kicker">Portfolio</p>
    <h2>And what you follow</h2>
    <ul class="points">
      <li class="in" data-say="watchlist">Watchlist: just the tickers</li>
      <li class="in" data-say="save">Save opens your dashboard</li>
    </ul>
    <p class="try in" data-say="test"><b>Try it</b>Add five or six stocks. They need not be your real ones.</p>
  </aside>
</main>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Demo account · real prices, close of Oct 7, 2026 (Yahoo Finance)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
<script src="../../../theme/tour.js"></script>
</body>
</html>
