<body class="tour tone-ember">
<header class="top"><span class="chip">My Hub · Demo</span><span class="part">4 of 7 · Watchlist</span></header>
<main class="slide tour-row">
  <figure class="screen">
    <div class="bar"><i></i><i></i><i></i><span>themarkethub.app/watchlist</span></div>
    <div class="view">
      <div class="shot" data-cam="0:60,50,1.26 choose:51,42,1.65"><img src="shots/watch-charts.jpg" alt="">

    </div>
  </figure>
  <aside class="notes">
    <p class="kicker">Watchlist</p>
    <h2>A wall of charts</h2>

      <li class="in" data-say="many#2">1 to 12 charts at a time</li>
      <li class="in" data-say="span">3 months to 2 years</li>
      <li class="in" data-say="candles">Candles or a line</li>
      <li class="in" data-say="moving">20, 50 and 200-day averages</li>
    </ul>
  </aside>
</main>
<footer class="foot"><span class="brand">Market Hub</span><span class="source">Demo account · real prices, close of Oct 7, 2026 (Yahoo Finance)</span></footer>
