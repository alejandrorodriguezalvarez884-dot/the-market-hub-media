<!doctype html>
<!-- The thumbnail: the tax bracket myth, three glasses, and the presenter. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  body.thumbnail { padding-bottom: 0; }
  body.thumbnail h1 { font-size: 11vw; max-width: none; line-height: 0.98; }
  .cups { display: block; width: 30vw; overflow: visible; }
</style>
</head>
<body class="thumbnail tone-forest">
<div class="stage">
  <main class="slide">
    <span class="chip solid" style="align-self: flex-start" data-series>Money 101</span>
    <h1>The bracket <span class="mark">myth</span></h1>
    <svg class="cups" viewBox="0 0 600 220">
      <g transform="translate(0 0)"><path d="M20 20 L42 200 L158 200 L180 20 Z" fill="var(--sky)"/><path d="M20 20 L42 200 L158 200 L180 20" fill="none" stroke="var(--snow)" stroke-width="8" stroke-linejoin="round"/><text x="100" y="128" font-size="52" text-anchor="middle" style="fill: var(--on-accent)">0%</text></g>
      <g transform="translate(200 0)"><path d="M20 20 L42 200 L158 200 L180 20 Z" fill="var(--sky)"/><path d="M20 20 L42 200 L158 200 L180 20" fill="none" stroke="var(--snow)" stroke-width="8" stroke-linejoin="round"/><text x="100" y="128" font-size="52" text-anchor="middle" style="fill: var(--on-accent)">20%</text></g>
      <g transform="translate(400 0)"><path d="M33 130 L42 200 L158 200 L167 130 Z" fill="var(--coral)"/><path d="M20 20 L42 200 L158 200 L180 20" fill="none" stroke="var(--snow)" stroke-width="8" stroke-linejoin="round"/><text x="100" y="100" font-size="52" text-anchor="middle">40%</text></g>
    </svg>
  </main>
  <div class="presenter" data-cues="-2:shrug"></div>
</div>
<script src="../../theme/presenter.js"></script>
<script src="../../theme/slide.js"></script>
</body>
</html>
