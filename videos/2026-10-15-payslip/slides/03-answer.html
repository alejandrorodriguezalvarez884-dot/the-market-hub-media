<!doctype html>
<!-- The answer: you take home more, about six hundred of the thousand. The higher rate takes four hundred, and nothing of the pay you had. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .big { max-width: none; font-size: 5.6vw; white-space: nowrap; line-height: 1; font-weight: 800; letter-spacing: -0.045em; color: var(--ink-strong); }
  .lead { max-width: none; }
  .hbars { gap: 1.8vh; }
  .hbar i { height: 6vh; }
  @media (orientation: portrait) {
    .slide { justify-content: flex-start; gap: 1.4vh; }
    .kicker { font-size: 2.6vw; }
    .big { font-size: 8.2vw; }
    .lead { font-size: 4.8vw; }
    .hbars { gap: 0.8vh; }
    .hbar > span { font-size: 2.4vw; }
    .hbar i { height: 2.6vh; }
    .hbar b { font-size: 5.4vw; }
  }
</style>
</head>
<body class="tone-ocean">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 04</span></header>
<main class="slide room">
<p class="kicker in">The raise into the 40% bracket</p>
  <p class="big pop" data-say="more">You take home <span class="mark">more</span></p>
  <div class="hbars">
    <div class="hbar"><span>The raise</span><div><i class="wide quiet" data-say="thousand" style="width: 60%"></i><b class="in" data-say="thousand">$1,000</b></div></div>
    <div class="hbar"><span>Yours</span><div><i class="wide" data-say="six" style="width: 36%"></i><b class="in" data-say="six">+$600</b></div></div>
    <div class="hbar"><span>Tax at 40%</span><div><i class="wide" data-say="four" style="width: 24%; background: var(--coral)"></i><b class="in" data-say="four">$400</b></div></div>
  </div>
  <p class="lead in" data-say="cent">Not a cent of the pay you <span class="hl" data-say="already">already had</span>.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic, with an example tax: 40% above the line</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
