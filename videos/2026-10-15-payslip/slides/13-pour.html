<!doctype html>
<!-- Pay poured in from the left fills the first glass, then spills into the second, then into the third. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .slide { gap: 2.4vh; padding-bottom: 3.4vh; }
  .art { flex: none; height: 52vh; }
  .pour { transform-box: fill-box; transform-origin: top; animation: pour 0.5s ease-in both; animation-delay: var(--at, 0s); }
  @keyframes pour { from { transform: scaleY(0); } }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 04</span></header>
<main class="slide room">

    <rect class="pour" data-say="poured" x="222" y="0" width="16" height="118" rx="6" fill="var(--sky)"/>

    <path class="draw" data-say="then#2" pathLength="1" d="M602 104 Q640 30 700 112" fill="none" stroke="var(--sky)" stroke-width="12" stroke-linecap="round"/>
  </svg>
  <p class="lead in" data-say="poured">Your pay fills them <span class="hl" data-say="first">in order</span>.</p>
