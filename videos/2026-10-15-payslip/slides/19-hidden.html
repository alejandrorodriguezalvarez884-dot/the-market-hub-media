<!doctype html>
<!-- One more slice, and it is not on the payslip at all. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .scene { display: block; overflow: visible; width: 34vw; }
  .lead { max-width: none; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 04</span></header>
<div class="stage">
<main class="slide">
<svg class="scene" viewBox="0 0 520 250">
      <g class="pop" data-say="slice"><rect x="20" y="20" width="230" height="220" rx="14" fill="var(--snow)"/><path d="M50 70 H220 M50 110 H200 M50 150 H220 M50 190 H170" stroke="#3a3566" stroke-width="12" stroke-linecap="round"/></g>
      <g class="pop" data-say="payslip"><rect x="300" y="60" width="190" height="140" rx="14" fill="none" stroke="var(--coral)" stroke-width="7" stroke-dasharray="16 12"/><text x="395" y="150" font-size="70" text-anchor="middle" style="fill: var(--coral)">?</text></g>
    </svg>
    <h2 class="in" data-say="slice">One more <span class="hl" data-say="slice">slice</span>.</h2>
    <p class="lead in" data-say="payslip">Not on your payslip <span class="mark">at all</span>.</p>
</main>
<div class="presenter" data-cues="0:open slice:one payslip:point"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
