<!doctype html>
<!-- Two rates: the marginal rate, what the next dollar pays, forty percent here; and the average rate, all the tax divided by all the pay, fifteen percent here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .card { display: flex; flex-direction: column; gap: 1vh; padding: 3.6vh 2.4vw; }
  .name { font-family: var(--mono); font-size: 1.5vw; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .fig { font-size: 9vw; line-height: 1; font-weight: 800; letter-spacing: -0.05em; }
  .what { font-size: 2.3vw; font-weight: 600; color: var(--ink-strong); max-width: none; }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 04</span></header>
<main class="slide room">
<p class="kicker in">Two rates, on $40,000 a year</p>
  <div class="row">
    <div class="card in" data-say="marginal"><p class="name">Marginal rate</p><p class="fig pop" data-say="forty" style="color: var(--coral)">40%</p><p class="what">What your next dollar pays</p></div>
    <div class="card in" data-say="average"><p class="name">Average rate</p><p class="fig pop" data-say="fifteen" style="color: var(--pop)">15%</p><p class="what">All the tax &divide; all the pay<br>$6,000 &divide; $40,000</p></div>
  </div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic, with the example tax</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
