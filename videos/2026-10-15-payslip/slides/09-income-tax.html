<!doctype html>
<!-- The first place: income tax, which goes to the government and pays for what the state runs, such as roads, schools and courts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .slide { gap: 2.6vh; }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 04</span></header>
<main class="slide room">
<p class="kicker in">The first place</p>
  <h1 class="pop" data-say="income" style="max-width: none"><span class="mark">Income tax</span></h1>
  <p class="lead in" data-say="state">Pays for what the state runs.</p>
  <div class="tiles">
    <div class="tile pop" data-say="roads"><svg viewBox="0 0 100 100"><path d="M38 92 L46 8 H54 L62 92 Z" fill="var(--snow)"/><path d="M50 18 V30 M50 44 V56 M50 70 V82" stroke="#1b173f" stroke-width="5"/></svg>Roads</div>
    <div class="tile pop" data-say="schools"><svg viewBox="0 0 100 100"><path d="M10 40 L50 14 L90 40 Z" fill="var(--sun)"/><rect x="18" y="40" width="64" height="48" fill="var(--snow)"/><rect x="42" y="58" width="16" height="30" fill="#3a3566"/></svg>Schools</div>
    <div class="tile pop" data-say="courts"><svg viewBox="0 0 100 100"><path d="M10 34 L50 10 L90 34 Z" fill="var(--violet)"/><g fill="var(--snow)"><rect x="18" y="38" width="10" height="40"/><rect x="38" y="38" width="10" height="40"/><rect x="58" y="38" width="10" height="40"/><rect x="76" y="38" width="10" height="40"/><rect x="10" y="80" width="80" height="10"/></g></svg>Courts</div>
  </div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
