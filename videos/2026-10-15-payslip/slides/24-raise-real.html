<!doctype html>
<!-- Of a real raise, income tax and contributions took between a quarter and just over half, for a single worker on the average wage, in most OECD countries. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .slide { gap: 3vh; padding-bottom: 3.4vh; }
  .art { flex: none; height: 36vh; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 04</span></header>
<main class="slide room">
<p class="kicker in">Of a raise &middot; single worker, average wage, most OECD countries</p>
  <svg class="art" viewBox="0 0 1000 300">
    <rect class="wide" style="--at: 0s" x="40" y="110" width="920" height="80" rx="14" fill="rgba(255,255,255,0.14)"/>
    <rect class="wide" data-say="quarter" x="270" y="110" width="276" height="80" fill="var(--coral)"/>
    <text class="tick fade" style="--at: 0s" x="40" y="240" font-size="26">$0</text>
    <text class="tick fade" style="--at: 0s" x="960" y="240" font-size="26" text-anchor="end">$100</text>
    <text class="pop" data-say="quarter" x="270" y="84" font-size="40" text-anchor="middle" style="fill: var(--coral)">25</text>
    <text class="pop" data-say="half" x="546" y="84" font-size="40" text-anchor="middle" style="fill: var(--coral)">55</text>
  </svg>
  <p class="lead in" data-say="quarter">Taken: <span class="hl" data-say="half">a quarter to just over half</span>.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Source: OECD, Taxing Wages 2026, marginal rates (income tax + employee contributions)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
