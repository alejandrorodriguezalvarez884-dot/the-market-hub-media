<!doctype html>
<!-- The presenter asks: how much you start with, or how early you start? -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .stage > .slide { gap: 1vh; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <h1 class="in" data-say="how much">How much?</h1>
    <h1 class="in" data-say="or how"><span class="muted">Or</span> <span class="hl" data-say="how early">how early?</span></h1>
</main>
<div class="presenter" data-cues="0:open how_much:shrug or_how:explain"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
