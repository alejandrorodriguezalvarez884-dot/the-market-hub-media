<!doctype html>
<!-- The hook: a thousand dollars at eight percent for forty years, and what it becomes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .figure { font-size: 9.6vw; color: var(--accent); }
  @media (orientation: portrait) {
    h1 { font-size: 9.6vw; }
    .figure { font-size: 19vw; }
    .lead { font-size: 5.4vw; }
    .stage > .slide { gap: 1.2vh; }
  }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <p class="kicker in" data-say="put">8% a year &middot; 40 years &middot; untouched</p>
    <h1 class="in" data-say="thousand">$1,000 <span class="muted">becomes</span></h1>
    <p class="figure fade" data-say="more than"><span data-count="21725" data-from="1000" data-prefix="$" data-say="more than" data-for="1.4">$21,725</span></p>
    <p class="lead in" data-say="most">Most of it arrives <span class="hl" data-say="last">at the end</span>.</p>
</main>
<div class="presenter" data-cues="0:open how_much:shrug more:explain most:one"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: 8% a year, compounded yearly. An example, not a forecast.</span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
