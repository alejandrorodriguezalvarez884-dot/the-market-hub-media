<!doctype html>
<!-- The presenter: compound interest works for whoever is owed the money. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .step { font-size: 2.7vw; } .step .n.owe { background: var(--down); }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in" data-say="works">It works for whoever is <span class="hl" data-say="owed">owed</span> the money.</h2>
    <div class="steps">
      <p class="step in" data-say="a bank"><span class="n">+</span>Savings: the bank pays you</p>
      <p class="step in" data-say="you pay"><span class="n owe">&minus;</span>A loan: you pay the bank</p>
    </div>
</main>
<div class="presenter" data-cues="0:open a_bank:point you_pay:explain"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
