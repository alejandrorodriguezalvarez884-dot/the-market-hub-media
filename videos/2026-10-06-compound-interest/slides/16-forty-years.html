<!doctype html>
<!-- A hundred dollars a month for forty years: 48,000 paid in, about 322,000 at the end. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .split { display: flex; height: 8vh; border-radius: 0.9vw; overflow: hidden; }
  .split i { display: block; background: var(--accent); }
  .split i.quiet { background: var(--line-strong); }
  .legend { display: flex; gap: 3vw; max-width: none; font-size: 2.2vw; font-weight: 700; color: var(--ink-strong); }
  .legend b { display: inline-block; width: 0.7em; height: 0.7em; margin-right: 0.5em; border-radius: 0.16em; background: var(--accent); }
  .legend b.quiet { background: var(--line-strong); }
  .figure { font-size: 10.5vw; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<main class="slide room">
  <p class="kicker in" data-say="take">$100 a month &middot; 40 years &middot; 8% a year</p>
  <p class="figure fade" data-say="end up"><span data-count="322108" data-prefix="$" data-say="end up" data-for="1.4">$322,108</span></p>
  <div class="split"><i class="quiet wide" data-say="pay" style="width: 14.9%"></i><i class="wide" data-say="end up" style="width: 85.1%"></i></div>
  <p class="legend"><span class="fade" data-say="pay"><b class="quiet"></b>Paid in: $48,000</span><span class="fade" data-say="end up+0.6"><b></b>Interest: $274,108</span></p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: 8% a year, compounded monthly. An example, not a forecast.</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
