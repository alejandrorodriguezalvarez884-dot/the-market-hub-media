<!doctype html>
<!-- The first ten years of deposits: a quarter of the money, more than half of the result. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .sum .pop, .sum .in { display: inline-block; }
  .parts { display: flex; gap: 1.4vw; }
  .parts .card { flex: 1; font-size: 4vw; font-weight: 800; letter-spacing: -0.035em; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
  .card small { display: block; margin-bottom: 0.8vh; font-family: var(--mono); font-size: 1.15vw; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  .parts .card { font-size: 2vw; font-weight: 600; letter-spacing: 0; color: var(--muted); }
  .share { display: block; font-size: 8.4vw; line-height: 1; font-weight: 800; letter-spacing: -0.05em; color: var(--ink-strong); }
  .share.accent { color: var(--accent); }
  .card em { display: block; margin-top: 1vh; font-style: normal; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<main class="slide room">
  <h2 class="in">The first ten years</h2>
  <div class="parts">
    <div class="card in" data-say="quarter"><small>Of the money paid in</small><span class="share">25%</span><em>$12,000 of $48,000</em></div>
    <div class="card in" data-say="more than half"><small>Of the result</small><span class="share accent">56%</span><em class="fade" data-say="twelve">$181,253 of $322,108</em></div>
  </div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: $100 a month, 8% a year, compounded monthly. An example, not a forecast.</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
