<!doctype html>
<!-- The three things to keep, counted on the presenter's fingers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .step { font-size: 2.8vw; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in">Three things to keep</h2>
    <div class="steps">
      <p class="step in" data-say="one"><span class="n">01</span>Interest on interest</p>
      <p class="step in" data-say="two"><span class="n">02</span>Slow, then fast</p>
      <p class="step in" data-say="three#2"><span class="n">03</span>72 &divide; rate = years to double</p>
    </div>
</main>
<div class="presenter" data-cues="0:open one:one two:two three#2:three"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
