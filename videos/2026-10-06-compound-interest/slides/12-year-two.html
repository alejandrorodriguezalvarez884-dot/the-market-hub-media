<!doctype html>
<!-- Year two: the interest earns interest. The extra 6.40 is the snowball picking up snow. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .sum .pop, .sum .in { display: inline-block; }
  .parts { display: flex; gap: 1.4vw; }
  .parts .card { flex: 1; font-size: 4vw; font-weight: 800; letter-spacing: -0.035em; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
  .card small { display: block; margin-bottom: 0.8vh; font-family: var(--mono); font-size: 1.15vw; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<main class="slide room">
  <p class="kicker in">Year 2</p>
  <p class="sum"><span class="in" data-say="all">$1,080</span><span class="accent pop" data-say="eighty-six">+ $86.40</span></p>
  <div class="parts">
    <div class="card in" data-say="eighty-six+0.9"><small>On your $1,000</small>$80.00</div>
    <div class="card in" data-say="extra"><small>On last year's interest</small><span class="hl" data-say="interest on">$6.40</span></div>
  </div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: 8% a year, compounded yearly. An example, not a forecast.</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
