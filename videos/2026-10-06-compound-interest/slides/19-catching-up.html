<!doctype html>
<!-- To end in the same place ten years late, the monthly amount is about 230, not 100. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .sum > span { display: inline-block; }
  .sum .was { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 0.08em; }
  .sum .unit { font-size: 0.4em; letter-spacing: -0.02em; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<main class="slide room">
  <p class="kicker in">Same result, starting ten years late</p>
  <p class="sum"><span class="in was" data-say="hundred">$100</span><span class="pop accent" data-say="two hundred">$230</span><span class="in unit" data-say="two hundred+0.3">a month</span></p>
  <p class="lead in" data-say="more than double">More than double. Every month. For thirty years.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: 8% a year, compounded monthly. An example, not a forecast.</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
