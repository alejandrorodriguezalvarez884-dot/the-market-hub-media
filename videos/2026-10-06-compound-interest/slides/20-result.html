<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .hbar { grid-template-columns: 17vw 1fr; }

<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>

  <div class="hbars">
    <div class="hbar"><span><b>Starts today</b>paid in $48,000</span><div><i class="wide early" data-say="early" style="width: 72%"></i><b class="fade" data-say="about">$322,108</b></div></div>
    <div class="hbar"><span><b>10 years later</b>paid in $36,000</span><div><i class="wide late" data-say="late" style="width: 31.5%"></i><b class="fade" data-say="about#2">$140,855</b></div></div>

<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: $100 a month, 8% a year, compounded monthly. An example, not a forecast.</span></footer>
