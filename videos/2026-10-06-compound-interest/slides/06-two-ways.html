<!doctype html>
<!-- Two ways to pay interest: on what was put in, or on everything that is there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .step { font-size: 2.7vw; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in">Two ways to pay interest</h2>
    <div class="steps">
      <p class="step in" data-say="only"><span class="n">A</span><span><span class="muted">Simple:</span> only on what you put in</span></p>
      <p class="step in" data-say="or on"><span class="n">B</span><span><span class="accent">Compound:</span> on everything that's there</span></p>
    </div>
</main>
<div class="presenter" data-cues="0:two only:open or_on:explain"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
