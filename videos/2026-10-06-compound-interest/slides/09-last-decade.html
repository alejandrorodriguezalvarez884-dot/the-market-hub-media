<!doctype html>
<!-- What each stretch added: the last ten years add more than the first thirty together. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  @media (orientation: portrait) { .slide { justify-content: flex-start; gap: 2.6vh; } .hbar i { height: 5.4vh; } .hbar b { font-size: 5.6vw; } }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<main class="slide room">
  <h2 class="in">What each stretch <span class="accent">added</span></h2>
  <div class="hbars">
    <div class="hbar"><span>Last 10 years</span><div><i class="wide" data-say="final" style="width: 70%"></i><b class="fade" data-say="almost">+$11,662</b></div></div>
    <div class="hbar"><span>First 30 years</span><div><i class="wide quiet" data-say="first thirty" style="width: 54.4%"></i><b class="fade" data-say="first thirty+0.4">+$9,063</b></div></div>
  </div>
  <p class="lead in" data-say="nothing">Nothing changed except <span class="hl" data-say="time">time</span>.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">$1,000 at 8% a year. An example, not a forecast.</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
