<!doctype html>
<!-- Two ways to grow: add the same amount every time, or add a share of what is already there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .step { font-size: 2.6vw; } .step .n.same { background: var(--sky); }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in">Two ways to <span class="accent">grow</span></h2>
    <div class="steps">
      <p class="step in" data-say="one"><span class="n same">+1</span>Add the same amount every time</p>
      <p class="step in" data-say="two#2"><span class="n">&times;</span>Add a share of what's already there</p>
    </div>
</main>
<div class="presenter" data-cues="0:two one:one two#2:two"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
