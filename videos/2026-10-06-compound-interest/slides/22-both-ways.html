<!doctype html>
<!-- The presenter: the snowball does not care which way it rolls. For you on savings, against you on a debt. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  .step { font-size: 2.7vw; } .step .n.for { background: var(--mint); }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 01</span></header>
<div class="stage">
<main class="slide">
    <h2 class="in" data-say="snowball">The snowball doesn't care <span class="hl" data-say="which">which way it rolls</span>.</h2>
    <div class="steps">
      <p class="step in" data-say="savings"><span class="n for">+</span>Savings: it grows for you</p>
      <p class="step in" data-say="debt"><span class="n">&minus;</span>A debt: it grows against you</p>
    </div>
</main>
<div class="presenter" data-cues="0:shrug savings:open debt:point"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
