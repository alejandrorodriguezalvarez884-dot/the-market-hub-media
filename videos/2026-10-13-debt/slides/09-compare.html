<!doctype html>
<!-- The same money, three rents: banks' rates in the United States on a five-year car loan, a personal loan and a credit card. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .slide { gap: 2vh; padding-top: 2vh; }
  .bars .bar b { font-size: 3.6vw; }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 03</span></header>
<main class="slide room">
<p class="kicker in">Same money, three rents &middot; United States, August 2026</p>
  <div class="bars">
    <div class="bar"><div><b class="in" data-say="seven">7.5%</b><i class="grow" data-say="seven" style="height: 27%; background: var(--sky)"></i></div><span>Car loan, 5 years</span></div>
    <div class="bar"><div><b class="in" data-say="twelve">11.9%</b><i class="grow" data-say="twelve" style="height: 43%; background: var(--sun)"></i></div><span>Personal loan, 2 years</span></div>
    <div class="bar"><div><b class="in" data-say="twenty-two">22.4%</b><i class="grow" data-say="twenty-two" style="height: 80%"></i></div><span>Credit card</span></div>
  </div>
  <p class="lead in" data-say="one">One number, to put them <span class="hl" data-say="side">side by side</span>.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Source: Federal Reserve, G.19, commercial bank interest rates, Aug 2026</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
