<!doctype html>
<!-- The presenter asks what would change the answer: not the card, not the rate, only the size of the bucket. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .lead s { text-decoration-thickness: 0.12em; text-decoration-color: var(--pop); }
  .size { max-width: none; font-size: 4.4vw; line-height: 1.02; font-weight: 800; letter-spacing: -0.04em; color: var(--sun); }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 03</span></header>
<div class="stage">
<main class="slide">
<h2 class="in">What would change the <span class="hl" data-say="answer">answer</span>?</h2>
    <p class="lead muted in" data-say="card"><s>A different card</s></p>
    <p class="lead muted in" data-say="rate"><s>A different rate</s></p>
    <p class="size pop" data-say="size">The size of the bucket.</p>
</main>
<div class="presenter" data-cues="0:shrug card:one rate:two size:open"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
