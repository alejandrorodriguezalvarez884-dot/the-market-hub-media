<!doctype html>
<!-- The answer: about eleven years, and about 3,800 dollars of interest on top of the 3,000 borrowed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .big { max-width: none; font-size: 6.2vw; white-space: nowrap; line-height: 1; font-weight: 800; letter-spacing: -0.045em; color: var(--ink-strong); }
  .lead { max-width: none; }
  .hbars { gap: 1.8vh; }
  .hbar i { height: 6vh; }

    .slide { justify-content: flex-start; gap: 1.6vh; }

<body class="tone-ocean">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 03</span></header>
<main class="slide room">
<p class="kicker in">Paying the minimum, every month</p>
  <p class="big pop" data-say="eleven">About <span class="mark">11</span> years</p>
  <div class="hbars">
    <div class="hbar"><span>You borrowed</span><div><i class="wide quiet" data-say="three" style="width: 45%"></i><b class="in" data-say="three">$3,000</b></div></div>
    <div class="hbar"><span>Interest</span><div><i class="wide" data-say="thirty-eight" style="width: 57%"></i><b class="in" data-say="thirty-eight">$3,800</b></div></div>
  </div>
  <p class="lead in" data-say="interest#2">The interest costs <span class="hl" data-say="more">more</span> than the thing.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic: 22% a year; minimum = interest + 1% of the balance, at least $40</span></footer>
