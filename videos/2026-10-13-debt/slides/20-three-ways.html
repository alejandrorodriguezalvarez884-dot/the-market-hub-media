<!doctype html>
<!-- The same debt at the same rate, paid three ways: 3,800, 1,900 or 800 dollars of interest. What changed is the time. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .slide { gap: 2vh; padding-top: 2vh; }
  .bars .bar b { font-size: 3.4vw; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 03</span></header>
<main class="slide room">
<p class="kicker in">Interest on the same $3,000, at the same 22%</p>
  <div class="bars">
    <div class="bar"><div><b class="in" data-say="thirty-eight">$3,800</b><i class="grow" data-say="thirty-eight" style="height: 78%"></i></div><span>The minimum &middot; 11 years</span></div>
    <div class="bar"><div><b class="in" data-say="nineteen">$1,900</b><i class="grow" data-say="nineteen" style="height: 39%; background: var(--sun)"></i></div><span>$85 a month &middot; under 5</span></div>
    <div class="bar"><div><b class="in" data-say="eight">$800</b><i class="grow" data-say="eight" style="height: 16%; background: var(--mint)"></i></div><span>$150 a month &middot; about 2</span></div>
  </div>
  <p class="lead in" data-say="only">What changed: <span class="hl" data-say="long">how long</span> the water stayed.</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Our arithmetic, rounded. Examples, not forecasts</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
