<!doctype html>
<!-- The presenter: borrowing is not bad. In episode 1 time worked for you; here time is what you pay for, and the minimum buys a lot of it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .step { font-size: 2.7vw; }
  .step .n { width: 3.4em; }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 03</span></header>
<div class="stage">
<main class="slide">
<h2 class="in">Borrowing isn't <span class="hl" data-say="bad">bad</span>.</h2>
    <div class="steps">
      <p class="step in" data-say="episode"><span class="n" style="background: var(--sky)">EP 1</span>Time worked for you</p>
      <p class="step in" data-say="here"><span class="n">NOW</span>Time is what you pay for</p>
    </div>
    <p class="lead in" data-say="minimum">The minimum buys <span class="hl" data-say="lot">a lot of it</span>.</p>
</main>
<div class="presenter" data-cues="0:explain home:open episode:one here:point minimum:shrug"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
