<!doctype html>
<!-- Back to the coffee: five dollars every workday is a little over a hundred dollars a month; the average US household spends about 2,200 a month on housing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .bars { flex: none; height: 56vh; max-width: 64vw; gap: 5vw; }
  .bars .bar b { font-size: 4vw; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 05</span></header>
<main class="slide room">
<p class="kicker in">A month &middot; US</p>
<div class="bars">
  <div class="bar"><div><b class="in" data-say="hundred">$108</b><i class="grow" data-say="hundred" style="height: 4.2%; background: var(--sun)"></i></div><span>Coffee, $5 a workday</span></div>
  <div class="bar"><div><b class="in" data-say="twenty-two">$2,190</b><i class="grow" data-say="twenty-two" style="height: 85%"></i></div><span>Housing, average</span></div>
</div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Coffee: an example price. Housing: BLS 2024, $26,266 a year</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
