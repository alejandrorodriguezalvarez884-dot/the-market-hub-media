<!doctype html>
<!-- The CFPB's definition: a budget is a plan of the money you expect to receive and how it will be spent or saved; also called a spending plan. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .flow { display: flex; align-items: center; gap: 1.4vw; flex-wrap: wrap; }
  .pill { padding: 1.2vh 2vw; border-radius: 99em; background: var(--raised); border: 1px solid var(--line-strong); font-size: 2.8vw; font-weight: 800; color: var(--ink-strong); }
  .arrow { font-size: 3.4vw; color: var(--pop); font-weight: 800; }
  .quote { font-size: 3.2vw; font-weight: 700; color: var(--ink-strong); max-width: none; }
</style>
</head>
<body class="tone-plum">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 05</span></header>
<main class="slide room">
<p class="kicker in">US Consumer Financial Protection Bureau</p>
<h1 class="in" data-say="budget">A budget is a <span class="hl" data-say="plan">plan</span>.</h1>
<div class="flow">
  <span class="pill pop" data-say="receive">What comes in</span>
  <span class="arrow fade" data-say="spent">&rarr;</span>
  <span class="pill pop" data-say="spent">Spent</span>
  <span class="pill pop" data-say="saved">or saved</span>
</div>
<p class="quote in" data-say="second">&ldquo;Also called a <span class="mark">spending plan</span>.&rdquo;</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Source: CFPB, Financial terms glossary</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
