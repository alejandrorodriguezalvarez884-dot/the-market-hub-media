<!doctype html>
<!-- Fixed costs: they come every month and cost about the same. Rent, a phone plan, a loan payment. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .slide { gap: 4vh; }
  .tile { font-size: 3vw; padding: 5vh 2vw; flex-direction: column; align-items: flex-start; gap: 2.4vh; }
  .tile svg { width: 7vw; height: 7vw; }
</style>
</head>
<body class="tone-forest">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 05</span></header>
<main class="slide room">
<p class="kicker in">Fixed costs</p>
<h2 class="in" data-say="every">Every month. <span class="hl" data-say="same">About the same.</span></h2>
<div class="tiles"><div class="tile pop" data-say="rent"><svg viewBox="0 0 48 48"><path d="M6 22 L24 7 L42 22 V42 H6 Z" fill="var(--coral)"/><rect x="19" y="28" width="10" height="14" fill="var(--on-accent)"/></svg><span>Rent</span></div><div class="tile pop" data-say="phone"><svg viewBox="0 0 48 48"><rect x="13" y="4" width="22" height="40" rx="5" fill="var(--sky)"/><rect x="16" y="9" width="16" height="26" rx="2" fill="var(--on-accent)"/></svg><span>A phone plan</span></div><div class="tile pop" data-say="loan"><svg viewBox="0 0 48 48"><rect x="5" y="12" width="38" height="26" rx="5" fill="var(--violet)"/><rect x="5" y="18" width="38" height="6" fill="var(--on-accent)"/><rect x="10" y="29" width="12" height="4" rx="2" fill="var(--snow)"/></svg><span>A loan payment</span></div></div>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Source: CFPB, Financial terms glossary</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
