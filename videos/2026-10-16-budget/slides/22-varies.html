<!doctype html>
<!-- Pay that varies: 58 percent of the self-employed and 28 percent of employees said their income varies month to month (Fed, 2025). One way budgets handle it: start from a lean month. -->

<head>

<link rel="stylesheet" href="../../../theme/slide.css">
