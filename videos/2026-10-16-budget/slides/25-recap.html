<!doctype html>
<!-- The three things to keep, counted on the presenter's fingers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .step { font-size: 2.5vw; }
</style>
</head>
<body>
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 05</span></header>
<div class="stage">
<main class="slide">
<h2 class="in">Three things to keep</h2>
<div class="steps">
  <p class="step in" data-say="one"><span class="n">01</span>Cut the pizza first. It&rsquo;s net pay.</p>
  <p class="step in" data-say="two"><span class="n" style="background: var(--sky)">02</span>Three slices take about half</p>
  <p class="step in" data-say="three#3"><span class="n" style="background: var(--pink)">03</span>What&rsquo;s left is a slice too</p>
</div>
</main>
<div class="presenter" data-cues="0:open one:one two:two three#3:three"></div>
</div>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source"></span></footer>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
