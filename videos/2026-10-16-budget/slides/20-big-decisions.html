<!-- The big slices are set by a few big decisions made once in a while (where you live, how you get around); the small ones every day. -->

  .row { gap: 2.4vw; align-items: stretch; }
  .card { display: flex; flex-direction: column; gap: 2.4vh; }
  .icons { display: flex; gap: 2vw; }
  .icons svg { width: 12vw; height: 12vw; }
  .dots { width: 100%; height: 12vw; overflow: visible; }
