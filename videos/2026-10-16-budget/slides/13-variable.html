<!doctype html>
<!-- Variable costs: they change from month to month. Groceries, getting around, going out. -->
<html lang="en">

  .tile { font-size: 3vw; padding: 5vh 2vw; flex-direction: column; align-items: flex-start; gap: 2.4vh; }
