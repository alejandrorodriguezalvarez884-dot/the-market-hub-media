<!doctype html>
<!-- Three slices, somewhere to live, a way to get around and something to eat, take about half of everything in the EU and more in the US. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../theme/slide.css">
<style>
  svg text { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink-strong); }
  .lead { max-width: none; }
  .three { display: flex; gap: 1.2vw; flex-wrap: wrap; }
  .pill { padding: 1.2vh 1.8vw; border-radius: 99em; background: var(--raised); border: 1px solid var(--line-strong); font-size: 2.4vw; font-weight: 800; color: var(--ink-strong); }
  .hbar { grid-template-columns: 6vw 1fr; }
  .hbar > div { max-width: 60vw; }
  .hbar i { height: 8vh; }
  .lead { color: var(--muted); font-size: 2.4vw; }
</style>
</head>
<body class="tone-ember">
<header class="top"><span class="chip" data-series>Money 101 &middot; EP 05</span></header>
<main class="slide room">
<div class="three">
  <span class="pill pop" data-say="live">Somewhere to live</span>
  <span class="pill pop" data-say="around">A way to get around</span>
  <span class="pill pop" data-say="eat">Something to eat</span>
</div>
<div class="hbars">
  <div class="hbar"><span>EU</span><div><i class="wide" data-say="half" style="width: 49.5%"></i><b class="in" data-say="half">49.5%</b></div></div>
  <div class="hbar"><span>US</span><div><i class="wide" data-say="more" style="width: 63.3%; background: var(--sun)"></i><b class="in" data-say="more">63%</b></div></div>
</div>
<p class="lead in" data-say="together">Of everything households spend</p>
</main>
<footer class="foot"><span class="brand">The Market Hub</span><span class="source">Sources: Eurostat 2024; BLS 2024 (housing, transportation, food)</span></footer>
<div class="presenter corner"></div>
<script src="../../../theme/presenter.js"></script>
<script src="../../../theme/slide.js"></script>
</body>
</html>
